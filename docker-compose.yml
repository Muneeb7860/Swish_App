version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: swiss-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: swissq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swissq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swiss-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: swiss-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:28082,OUTSIDE://0.0.0.0:8082
      - --advertise-pandaproxy-addr PLAINTEXT://redpanda:28082,OUTSIDE://localhost:8082
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-monolith:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swiss-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swissq
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  bff-gateway:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: swiss-bff
    ports:
      - "8081:8081"
    environment:
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://backend-monolith:8080
    depends_on:
      - backend-monolith

  frontend-host:
    build:
      context: ./frontend-host
      dockerfile: Dockerfile
    container_name: swiss-frontend-host
    ports:
      - "3000:80"
    depends_on:
      - bff-gateway

  frontend-customer:
    build:
      context: ./frontend-customer
      dockerfile: Dockerfile
    container_name: swiss-frontend-customer
    ports:
      - "3001:80"
    depends_on:
      - bff-gateway

  frontend-rider:
    build:
      context: ./frontend-rider
      dockerfile: Dockerfile
    container_name: swiss-frontend-rider
    ports:
      - "3002:80"
    depends_on:
      - bff-gateway

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: swiss-frontend-admin
    ports:
      - "3003:80"
    depends_on:
      - bff-gateway

volumes:
  postgres-data:
