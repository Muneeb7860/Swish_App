

services:
  postgres:
    image: postgres:14-alpine
    container_name: swiss_postgres
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: swiss_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiss_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend-tier

  mongodb:
    image: mongo:6.0
    container_name: swiss_mongodb
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - backend-tier

  redis:
    image: redis:7-alpine
    container_name: swiss_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend-tier

  backend:
    build:
      context: ../backend
    container_name: swiss_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swiss_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY}
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - JAVA_OPTS=-Xmx256m -Xms256m
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend-tier
    extra_hosts:
      - "host.docker.internal:host-gateway"


  bff:
    build:
      context: ../bff
      dockerfile: Dockerfile
    container_name: swiss_bff
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8080
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_OPTS=-Xmx128m -Xms128m
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend-tier
      - backend-tier

# nginx service disabled

  prometheus:
    image: prom/prometheus:latest
    container_name: swiss_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules:/etc/prometheus/alert.rules
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - backend-tier

#   alertmanager:
#     # Disabled due to image pull issues; enable with a working image later
#     # image: prom/alertmanager:latest
#     # container_name: alertmanager
#     # ports:
#     #   - "9093:9093"
#     # networks:
#     #   - backend-tier
      
  grafana:
    image: grafana/grafana:latest
    container_name: swiss_grafana
    ports:
      - "3000:3000"
    networks:
      - backend-tier
      
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: swiss_zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-tier

  kafka:
    image: bitnami/kafka:latest
    container_name: swiss_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-tier

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: swiss_zipkin
    ports:
      - "9411:9411"
    networks:
      - backend-tier

networks:
  frontend-tier:
    driver: bridge
  backend-tier:
    driver: bridge
