version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: swiss_postgres
    environment:
      POSTGRES_DB: swiss_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: swisssecure2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiss_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend-tier

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.3
    container_name: swiss_kafka
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:29092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:8083
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:8083
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:8084
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr kafka:33145
    networks:
      - backend-tier

  mongodb:
    image: mongo:6.0
    container_name: swiss_mongodb
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - backend-tier

  redis:
    image: redis:7-alpine
    container_name: swiss_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend-tier

  backend:
    build:
      context: ./backend
    container_name: swiss_backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swiss_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=swisssecure2026
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY:-mock-key}
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - JAVA_OPTS=-Xmx256m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend-tier
    extra_hosts:
      - "host.docker.internal:host-gateway"


  bff:
    build:
      context: ./bff
    container_name: swiss_bff
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8080
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_OPTS=-Xmx128m -Xms128m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend-tier
      - backend-tier

  nginx:
    image: nginx:alpine
    container_name: swiss_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-host/dist:/usr/share/nginx/html/host:ro
      - ./frontend-customer/dist:/usr/share/nginx/html/customer:ro
      - ./frontend-admin/dist:/usr/share/nginx/html/admin:ro
      - ./frontend-rider/dist:/usr/share/nginx/html/rider:ro
    depends_on:
      - bff
    restart: unless-stopped
    networks:
      - frontend-tier

  prometheus:
    image: prom/prometheus:latest
    container_name: swiss_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules:/etc/prometheus/alert.rules
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - backend-tier

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    networks:
      - backend-tier
      
  grafana:
    image: grafana/grafana:latest
    container_name: swiss_grafana
    ports:
      - "3000:3000"
    networks:
      - backend-tier
      
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: swiss_zipkin
    ports:
      - "9411:9411"
    networks:
      - backend-tier

networks:
  frontend-tier:
    driver: bridge
  backend-tier:
    driver: bridge
