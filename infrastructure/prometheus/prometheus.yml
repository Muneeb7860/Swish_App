global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'local'
    project: 'swish'

rule_files:
  - 'alert.rules'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093   # uncomment when alertmanager is enabled

scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot backend (modular DDD monolith).
  # In single-node dev the backend runs on the HOST via `mvn spring-boot:run`
  # (server.port=8083), NOT inside this compose network — so Prometheus reaches
  # it through host.docker.internal (mapped to host-gateway in extra_hosts).
  # The job label is 'backend' to match the Mission Control dashboard and
  # alert.rules expressions.
  - job_name: 'backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: 'backend'
          layer: 'core'

  # Python Governance microservice
  - job_name: 'governance'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'governance'
          layer: 'governance'

  # ── Target topology (multi-service extraction, R4 blueprint) ────────────────
  # These services do not run in single-node dev, so they are intentionally not
  # scraped (scraping them would fire the ServiceDown alert continuously). The
  # Mission Control dashboard keeps placeholder panels for them; uncomment a job
  # here once that service is physically extracted and running on the host.
  #
  # - job_name: 'platform-gateway'      # Spring Cloud Gateway (edge) — :8080
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['host.docker.internal:8080']
  #       labels: { service: 'platform-gateway', layer: 'edge' }
  #
  # - job_name: 'core-business-engine'  # checkout / B2B — :8081
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['host.docker.internal:8081']
  #       labels: { service: 'core-business-engine', layer: 'core' }
  #
  # - job_name: 'notification-engine'   # Kafka → WebSocket — :8082
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['host.docker.internal:8082']
  #       labels: { service: 'notification-engine', layer: 'async' }
