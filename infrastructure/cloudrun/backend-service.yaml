# Cloud Run service manifest for the Swish backend.
#
# Deploy via:
#   gcloud run services replace infrastructure/cloudrun/backend-service.yaml \
#     --region=europe-west6
#
# First-time setup (run once per project):
#   gcloud services enable run.googleapis.com secretmanager.googleapis.com \
#     artifactregistry.googleapis.com cloudbuild.googleapis.com
#
#   gcloud iam service-accounts create swish-backend-sa \
#     --display-name="Swish Backend Service Account"
#
#   # Allow the SA to read secrets from Secret Manager
#   gcloud projects add-iam-policy-binding $PROJECT_ID \
#     --member="serviceAccount:swish-backend-sa@$PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#
#   # Create the JWT_SECRET secret (replace <your-key> with a 256-bit base64 value)
#   gcloud secrets create JWT_SECRET --replication-policy=automatic
#   echo -n "<your-256-bit-hmac-key>" | \
#     gcloud secrets versions add JWT_SECRET --data-file=-
#
# Replace PROJECT_ID, DB_HOST, REDIS_HOST, and OPENAI_API_KEY below.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: swish-backend
  namespace: default
  annotations:
    # Only reachable through the Cloud Load Balancer or internally — not directly
    # from the public internet.
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Swish Quick Commerce Backend"

spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle (cost-efficient for dev/staging)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        # Each instance handles up to 80 concurrent requests before a new
        # instance is spun up.
        autoscaling.knative.dev/target: "80"

    spec:
      # Cloud Run SLA: requests time out after 5 minutes.
      timeoutSeconds: 300
      # 80 concurrent requests per instance (matches the target above).
      containerConcurrency: 80
      # Service account with roles/secretmanager.secretAccessor
      # Replace PROJECT_ID with your actual GCP project ID.
      serviceAccountName: swish-backend-sa@PROJECT_ID.iam.gserviceaccount.com

      containers:
        - name: backend
          # Artifact Registry image. Cloud Build populates this tag on each push.
          # Replace PROJECT_ID and REGION with your values.
          image: europe-west6-docker.pkg.dev/PROJECT_ID/swish/swish-backend:latest

          # Cloud Run routes traffic to PORT (default 8080).
          # application.properties uses ${PORT:8083} so no code change needed.
          ports:
            - containerPort: 8080

          env:
            # ── Spring profile ───────────────────────────────────────────────
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            # ── GCP project — auto-detected on Cloud Run via metadata server
            #    but explicit here so Secret Manager bootstrap works correctly.
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID

            # ── PostgreSQL (Cloud SQL) ────────────────────────────────────────
            # Use Cloud SQL Auth Proxy socket when running on Cloud Run:
            #   DB_HOST=/cloudsql/PROJECT_ID:REGION:INSTANCE_NAME
            - name: DB_HOST
              value: DB_HOST_PLACEHOLDER
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: swiss_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: DB_PASSWORD
                  key: latest
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: DB_PASSWORD
                  key: latest

            # ── Redis (Memorystore) ──────────────────────────────────────────
            - name: SPRING_DATA_REDIS_HOST
              value: REDIS_HOST_PLACEHOLDER
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            # ── Kafka (Confluent Cloud or self-hosted) ────────────────────────
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: KAFKA_BOOTSTRAP_PLACEHOLDER

            # ── OpenAI API Key ────────────────────────────────────────────────
            - name: SPRING_AI_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: OPENAI_API_KEY
                  key: latest

            # ── JVM tuning ────────────────────────────────────────────────────
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+ExitOnOutOfMemoryError
                -Djava.security.egd=file:/dev/./urandom

          # ── Resource limits ─────────────────────────────────────────────────
          resources:
            limits:
              # Cloud Run billing is per vCPU-second + memory-second.
              # 1 vCPU / 512 MiB is sufficient for the Spring Boot app.
              # Scale up to 2 vCPU / 1 GiB for production load.
              cpu: "1"
              memory: "512Mi"

          # ── Liveness / readiness (Cloud Run uses the health endpoint) ───────
          # Cloud Run does not support k8s-style probes, but the actuator
          # /health endpoint is reachable via the load balancer for uptime checks.

  # Send 100% of traffic to the latest revision by default.
  traffic:
    - percent: 100
      latestRevision: true
