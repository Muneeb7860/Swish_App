version: '3.8'

services:
  # 1. Clustered Database source of truth (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: swish-postgres-onprem
    environment:
      POSTGRES_DB: swiss_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresSecurePassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata-onprem:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiss_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. On-Premises Secrets Manager (HashiCorp Vault)
  vault:
    image: hashicorp/vault:1.15
    container_name: swish-vault-onprem
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token-change-me
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. WORM Object Storage for Ledger Archives (MinIO)
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: swish-minio-onprem
    environment:
      MINIO_ROOT_USER: minioAdmin
      MINIO_ROOT_PASSWORD: minioAdminSecure
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata-onprem:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Distributed Cache & Rate Limiter (Redis)
  redis:
    image: redis:7-alpine
    container_name: swish-redis-onprem
    command: redis-server --requirepass redissecurepassword
    ports:
      - "6379:6379"
    volumes:
      - redisdata-onprem:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redissecurepassword", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Message Broker KRaft Cluster (Kafka)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: swish-kafka-onprem
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 6. Analytical Cold Database (MongoDB)
  mongodb:
    image: mongo:6
    container_name: swish-mongo-onprem
    environment:
      MONGO_INITDB_ROOT_USERNAME: swiss_app
      MONGO_INITDB_ROOT_PASSWORD: swiss_app_password
      MONGO_INITDB_DATABASE: swiss_olap
    ports:
      - "27017:27017"
    volumes:
      - mongodata-onprem:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 7. Local Inference Engine (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: swish-ollama-onprem
    ports:
      - "11434:11434"
    volumes:
      - ollamadata-onprem:/root/.ollama

volumes:
  pgdata-onprem:
  miniodata-onprem:
  redisdata-onprem:
  mongodata-onprem:
  ollamadata-onprem:
