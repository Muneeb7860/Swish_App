apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-monolith
  labels:
    app: backend-monolith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-monolith
  template:
    metadata:
      labels:
        app: backend-monolith
    spec:
      containers:
      - name: backend-monolith
        image: swiss-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/swissq
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_REDIS_HOST
          value: redis
        - name: SPRING_REDIS_PORT
          value: "6379"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: redpanda:29092
---
apiVersion: v1
kind: Service
metadata:
  name: backend-monolith
spec:
  ports:
  - port: 8080
  selector:
    app: backend-monolith
