name: Enforce Branch Protection & Standards

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - master

jobs:
  validate-standards:
    name: Enforce Standards Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for commit validation

      - name: Require PR Description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          is_promotion=false
          if [ "$HEAD_REF" = "develop" ] || [[ "$PR_TITLE" =~ ^[Rr]elease: ]]; then
            is_promotion=true
          fi

          if [ -z "$PR_BODY" ] || [ "${#PR_BODY}" -lt 10 ]; then
            echo "❌ ERROR: A detailed Pull Request description is required (min 10 characters)."
            if [ "$BASE_REF" = "master" ] && [ "$is_promotion" = "false" ]; then
              exit 1
            else
              echo "⚠️ WARNING: Bypassing PR description failure for promotion/develop target branch."
            fi
          else
            echo "✅ PR Description exists and is sufficiently detailed."
          fi

      - name: Mandate PR Checklist
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          is_promotion=false
          if [ "$HEAD_REF" = "develop" ] || [[ "$PR_TITLE" =~ ^[Rr]elease: ]]; then
            is_promotion=true
          fi

          echo "Checking if PR description includes a selected Type of Change..."
          
          # Match a selected checkbox in the body (e.g. - [x] or * [x] with one of the change types)
          if ! echo "$PR_BODY" | grep -Ei "^\s*[-*+]\s*\[x\].*\*\*(Frontend|Backend|AI|DevOps)" >/dev/null; then
            echo "❌ ERROR: You must select at least one Type of Change checkbox in the Pull Request checklist."
            echo "Please check one of the following in your PR description:"
            echo "  - [x] 🎨 **Frontend UI Fix / Refactor**"
            echo "  - [x] ⚙️ **Backend Core Change**"
            echo "  - [x] 🤖 **AI / Governance Change**"
            echo "  - [x] 🛠️ **DevOps & Infra**"
            
            if [ "$BASE_REF" = "master" ] && [ "$is_promotion" = "false" ]; then
              exit 1
            else
              echo "⚠️ WARNING: Bypassing strict checklist enforcement for promotion/develop target branch."
            fi
          else
            echo "✅ PR Checklist validation passed: A change type was selected."
          fi

          # Cross-reference checklist selection with actually modified files.
          # If backend files changed, the user MUST check "Backend Core Change".
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          changed_files=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          
          backend_changed=false
          if echo "$changed_files" | grep -E "^(backend/|pom\.xml)" >/dev/null; then
            backend_changed=true
          fi
          
          backend_checked=false
          if echo "$PR_BODY" | grep -Ei "^\s*[-*+]\s*\[x\].*\*\*Backend" >/dev/null; then
            backend_checked=true
          fi
          
          if [ "$backend_changed" = true ] && [ "$backend_checked" = false ]; then
            echo "❌ ERROR: Backend files were modified, but 'Backend Core Change' was not selected in the PR checklist."
            echo "Please update your PR description checklist to select 'Backend Core Change'."
            if [ "$BASE_REF" = "master" ] && [ "$is_promotion" = "false" ]; then
              exit 1
            else
              echo "⚠️ WARNING: Bypassing strict backend validation for promotion/develop target branch."
            fi
          else
            echo "✅ PR Checklist alignment with changed files verified."
          fi

      - name: Prevent Direct Pushes to Master
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && github.actor != 'Muneeb7860'
        run: |
          echo "❌ ERROR: Direct pushes to master are restricted. Use PRs to develop/master."
          exit 1

      - name: Validate Commit Messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          is_promotion=false
          if [ "$HEAD_REF" = "develop" ] || [[ "$PR_TITLE" =~ ^[Rr]elease: ]]; then
            is_promotion=true
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Auditing commits from $BASE_SHA to $HEAD_SHA..."
          
          # Get list of commit subjects
          commits=$(git log --format=%s "$BASE_SHA".."$HEAD_SHA")
          echo "Commits to validate:"
          echo "$commits"
          echo "------------------------------------"
          
          # Enforce conventional commits pattern
          error_found=0
          while IFS= read -r commit; do
            if [ -z "$commit" ]; then continue; fi

            # Normalize Windows CRLF and leading/trailing whitespace
            commit=$(echo "$commit" | tr -d '\r' | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//')

            # Allow standard merge, revert, and release commits
            allowed_pattern="^([Mm]erge|[Rr]evert|release:).*"
            if [[ "$commit" =~ $allowed_pattern ]]; then
              echo "✅ Allowed: $commit"
              continue
            fi

            # Match conventional commit patterns (type(scope)!?: message)
            conventional_pattern="^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|security|observability)(\([^)]+\))?(!)?:[[:space:]]?.+"
            if [[ "$commit" =~ $conventional_pattern ]]; then
              echo "✅ Valid: $commit"
            else
              echo "❌ Invalid: $commit"
              error_found=1
            fi
          done <<< "$commits"
          
          if [ $error_found -eq 1 ]; then
            echo ""
            echo "❌ ERROR: Non-conventional commit found."
            echo "Conventional Commits format is required. Examples:"
            echo "  - feat: add Stripe payment gateway"
            echo "  - fix(cart): resolve double taxation bug"
            echo "  - docs: update API Swagger spec"
            echo "  - test: implement integration test suite"
            echo "  - security: fix SQL injection vulnerability"
            echo "Supported types: feat, fix, docs, style, refactor, test, chore, ci, build, perf, security, observability"
            if [ "$BASE_REF" = "master" ] && [ "$is_promotion" = "false" ]; then
              exit 1
            else
              echo "⚠️ WARNING: Bypassing strict Conventional Commits failure for promotion/develop target branch."
            fi
          fi
          echo "✅ All commits pass Conventional Commits check."
