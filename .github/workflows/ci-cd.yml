name: Swiss Q-Commerce CI/CD Pipeline

on:
  push:
    branches:
      - Windows_Machine
      - main
  pull_request:
    branches:
      - Windows_Machine
      - main

jobs:
  build-backend:
    name: Build & Test Backend Monolith
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Verify Monolith (Enforce 100% Coverage)
        run: |
          cd backend
          mvn clean verify

  build-bff:
    name: Build BFF Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build BFF Gateway
        run: |
          cd bff
          mvn clean package

  build-frontend:
    name: Build Micro-Frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Host MFE
        run: |
          cd frontend-host
          npm install
          npm run build

      - name: Build Customer MFE
        run: |
          cd frontend-customer
          npm install
          npm run build

      - name: Build Rider MFE
        run: |
          cd frontend-rider
          npm install
          npm run build

      - name: Build Admin MFE
        run: |
          cd frontend-admin
          npm install
          npm run build
