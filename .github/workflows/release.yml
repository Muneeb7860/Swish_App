name: Automated Semantic Release 🏷️

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'bff/**'
      - '.github/workflows/release.yml'

jobs:
  release:
    name: Create Production SemVer Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Version
        id: version
        run: |
          VERSION="v0.2.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release Node
        uses: ncipollo/release-action@v1
        with:
          tag: v0.2.${{ github.run_number }}
          name: Release v0.2.${{ github.run_number }}
          body: |
            ## 🚀 Swish App Release Candidate
            Automated production build and release baseline triggered from master.
            
            ### Changes
            - Core backend microservices and BFF updates.
            - Quality Gate validations validated successfully.
          draft: false
          prerelease: false
