name: Deploy to Cloud Run

# ─── Trigger ──────────────────────────────────────────────────────────────────
# Fires on every push to Mac_Machine (the working branch per branch strategy).
# Manual trigger via workflow_dispatch allows one-off deploys from the UI.
on:
  push:
    branches:
      - Mac_Machine
    paths:
      # Only redeploy when backend code, configuration, or the Dockerfile changes.
      # Ignores pure-frontend or docs changes.
      - "backend/**"
      - "infrastructure/cloudrun/**"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: ["staging", "production"]

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: read
  id-token: write   # Required for Workload Identity Federation (keyless auth)

# ─── Environment variables ────────────────────────────────────────────────────
env:
  REGION: europe-west6
  REPO: swish
  SERVICE: swish-backend
  # GCP project ID from repository secret
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # ─── Stage 0: Detect whether GCP deploy credentials are configured ─────────
  # When the GCP_* secrets are absent (e.g. local-first development before the
  # cloud is set up), the build + deploy stages are SKIPPED cleanly instead of
  # failing the run. Add the secrets — run scripts/setup-gcp.sh, then set the
  # printed values under Settings → Secrets and variables → Actions — and the
  # pipeline activates automatically, no workflow change required.
  preflight:
    name: Check GCP credentials
    runs-on: ubuntu-latest
    outputs:
      gcp_ready: ${{ steps.check.outputs.gcp_ready }}
    steps:
      - id: check
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$GCP_SERVICE_ACCOUNT" ]; then
            echo "gcp_ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ GCP credentials present — build & deploy will run."
          else
            echo "gcp_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_* secrets not configured — skipping build & deploy. Run scripts/setup-gcp.sh and add the secrets to enable Cloud Run deployment."
          fi

  # ─── Stage 1: Quality gate (tests must pass before any image is built) ─────
  test:
    name: Backend quality gate (142 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: ./backend
        env:
          # Must be >= 256 bits (32 bytes) — TokenServiceAdapter builds an
          # HMAC-SHA key via Keys.hmacShaKeyFor(), which rejects shorter keys
          # with a WeakKeyException that fails every @SpringBootTest context.
          JWT_SECRET: ci-test-secret-placeholder-min-32-bytes!!
        run: mvn -q clean test

  # ─── Stage 2: Build + push Docker image ────────────────────────────────────
  build-and-push:
    name: Build Docker image → Artifact Registry
    runs-on: ubuntu-latest
    needs: [test, preflight]
    # Run only when tests passed AND the GCP_* secrets exist; otherwise this job
    # (and the dependent deploy job) is skipped cleanly rather than failing.
    if: ${{ success() && needs.preflight.outputs.gcp_ready == 'true' }}
    outputs:
      image: ${{ steps.image-ref.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      # Keyless authentication to GCP via OIDC Workload Identity Federation.
      # No long-lived service account key stored in GitHub.
      # Setup guide: https://cloud.google.com/blog/products/identity-security/enabling-keyless-authentication-from-github-actions
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: image-ref
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}
        run: |
          docker build \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            --cache-from "$IMAGE:latest" \
            ./backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ─── Stage 3: Deploy to Cloud Run ─────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-and-push.outputs.image }}
          flags: >-
            --port=8080
            --memory=512Mi
            --cpu=1
            --concurrency=80
            --min-instances=0
            --max-instances=5
            --service-account=swish-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --no-allow-unauthenticated
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}

      - name: Verify deployment health
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Service URL: $URL"
          # The actuator/health endpoint requires no auth — it returns 200 {status:UP}
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
            "$URL/actuator/health" || echo "000")
          echo "Actuator health HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Service is healthy"
          else
            echo "❌ Health check returned HTTP $HTTP_STATUS — deployment may be degraded"
            exit 1
          fi

      - name: Post deployment summary
        run: |
          echo "## Cloud Run Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`${{ env.SERVICE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | \`${{ env.REGION }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ needs.build-and-push.outputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.deploy.outputs.url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
