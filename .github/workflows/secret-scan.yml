name: Secret Security Scan (TruffleHog)

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  trufflehog-scan:
    name: Audit Git History for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Trufflehog needs full history to scan commits in the PR

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Use an event-appropriate diff range. On pull_request, scan the PR
          # commits (base..head). On push, scan the pushed range (before..sha).
          # Hardcoding base to the default branch broke push-to-master because
          # base resolved to the same commit as HEAD, and TruffleHog aborts with
          # "BASE and HEAD commits are the same" under --fail.
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified
