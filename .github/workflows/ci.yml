name: Enterprise Quality Gates & CI/CD Pipeline 🚀

on:
  push:
    branches:
      - develop
      - master
      - Mac_Machine
  pull_request:
    branches:
      - develop
      - master
      - Mac_Machine

jobs:
  backend-quality:
    name: Backend Quality Gate (Test & Security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Local Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Resolve Backend Maven Dependencies
        working-directory: ./backend
        run: mvn -q dependency:resolve

      - name: Run Backend Tests & Generate Coverage
        working-directory: ./backend
        run: |
          mvn clean test
          mvn jacoco:report

      - name: Enforce Code Coverage Gate (75% Minimum)
        working-directory: ./backend
        run: mvn jacoco:check

      - name: OWASP Dependency Security Check
        working-directory: ./backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "🔐 NVD API key provided — running dependency-check with NVD updates."
            mvn org.owasp:dependency-check-maven:check -Dnvd.apiKey="$NVD_API_KEY" -DfailBuildOnCVSS=7
          else
            echo "⚠️ WARNING: NVD API key not set. Skipping OWASP Dependency Check to avoid rate-limiting failures on empty databases."
            echo "To run this check, please configure the 'NVD_API_KEY' secret in your repository settings."
          fi

  microservices-quality:
    name: Microservices Quality Gate (Gateway, Core Business, Notification, Shared Async)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Local Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Resolve Maven Dependencies
        run: mvn -q dependency:resolve

      - name: Build All Microservices
        run: mvn clean package -DskipTests

  frontend-quality:
    name: Frontend Quality Gate (Build & Lint)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mfe: [frontend-host, frontend-admin, frontend-customer, frontend-rider, frontend-b2b]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.mfe }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.mfe }}
        run: npm ci

      - name: Run ESLint Standards Validation
        working-directory: ./${{ matrix.mfe }}
        run: npm run lint

      - name: Build MFE Assets for Production
        working-directory: ./${{ matrix.mfe }}
        run: npm run build

  cypress-e2e:
    name: Cypress E2E (auth, orders, rider, admin)
    runs-on: ubuntu-latest
    # E2E requires the full stack. We spin up the backend against a real
    # PostgreSQL service — the Flyway migrations use PostgreSQL PL/pgSQL
    # functions and triggers that H2 cannot parse — plus a real Redis. The
    # backend runs under the `staging` profile (Postgres datasource; GCP
    # Secret Manager stays disabled). The Vite dev server runs against it.
    needs: [backend-quality]

    services:
      # Redis is needed by the Spring Boot app even in test mode
      # (StringRedisTemplate is @MockBean'd but the autoconfiguration still fires)
      # Use a real Redis so the app starts without connection errors.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # PostgreSQL backs the `staging` profile. Host port 5420 matches the
      # datasource URL in application-staging.properties (localhost:5420);
      # credentials match the staging defaults (postgres / swisssecure2026).
      postgres:
        # TimescaleDB image (drop-in PostgreSQL 16 + the timescaledb extension
        # preloaded) so the V25 sensor_readings hypertable migration applies.
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: swiss_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: swisssecure2026
        ports:
          - 5420:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swiss_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-customer/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: mvn -q dependency:resolve

      - name: Start backend (staging profile, Postgres, background)
        working-directory: ./backend
        env:
          JWT_SECRET: ci-e2e-test-secret-32-chars-long!!
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          ADMIN_EMAIL: ci-admin@swish.local
          ADMIN_PASSWORD: CiAdm1nP@ss!
          DB_SSL_MODE: disable
        run: |
          mvn spring-boot:run \
            -Dspring-boot.run.jvmArguments="-Dserver.port=8083" \
            -Dspring-boot.run.profiles=staging &
          echo "Backend PID: $!"
          # Wait until /actuator/health returns UP (max 90s)
          for i in $(seq 1 30); do
            STATUS=$(curl -sf http://localhost:8083/actuator/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "?")
            echo "Attempt $i — health: $STATUS"
            [ "$STATUS" = "UP" ] && break
            sleep 3
          done
          [ "$STATUS" = "UP" ] || (echo "Backend did not start in time" && exit 1)

      - name: Fetch admin JWT for Cypress
        id: admin-jwt
        run: |
          ADMIN_TOKEN=$(curl -sf -X POST http://localhost:8083/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-admin@swish.local","password":"CiAdm1nP@ss!"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")
          echo "ADMIN_TOKEN=${ADMIN_TOKEN}" >> "$GITHUB_ENV"
          echo "Admin JWT fetched (length ${#ADMIN_TOKEN})"

      - name: Install Cypress dependencies
        working-directory: ./frontend-customer
        run: npm ci

      - name: Start Vite dev server (background)
        working-directory: ./frontend-customer
        env:
          # Point the React app at the direct backend (no gateway in CI).
          # AuthGate.tsx and App.tsx read import.meta.env.VITE_API_URL at
          # build/dev time; without this the components would try port 8080
          # (the full-stack gateway default) and fail to reach the backend.
          VITE_API_URL: http://localhost:8083
        run: |
          npm run dev -- --port 5173 &
          sleep 8   # give Vite time to compile

      - name: Run Cypress E2E tests
        working-directory: ./frontend-customer
        env:
          CYPRESS_BASE_URL: http://localhost:5173
          CYPRESS_API_URL: http://localhost:8083
          CYPRESS_ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
        run: npm run cy:run -- --reporter junit --reporter-options "mochaFile=cypress/results/junit-[hash].xml"

      - name: Upload Cypress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            frontend-customer/cypress/results/
            frontend-customer/cypress/screenshots/
          retention-days: 7

  security-trivy:
    name: FileSystem Vulnerability Audit (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
