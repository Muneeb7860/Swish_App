name: Enterprise Quality Gates & CI/CD Pipeline 🚀

on:
  push:
    branches:
      - develop
      - master
      - mac-machine
      - macbook_machine
  pull_request:
    branches:
      - develop
      - master
      - mac-machine
      - macbook_machine

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      microservices: ${{ steps.filter.outputs.microservices }}
      frontend-host: ${{ steps.filter.outputs.frontend-host }}
      frontend-admin: ${{ steps.filter.outputs.frontend-admin }}
      frontend-customer: ${{ steps.filter.outputs.frontend-customer }}
      frontend-rider: ${{ steps.filter.outputs.frontend-rider }}
      frontend-b2b: ${{ steps.filter.outputs.frontend-b2b }}
      shared-ui: ${{ steps.filter.outputs.shared-ui }}
      governance: ${{ steps.filter.outputs.governance }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pom.xml'
              - '.github/workflows/ci.yml'
            microservices:
              - 'core-business-engine/**'
              - 'notification-engine/**'
              - 'platform-gateway/**'
              - 'shared-async-services/**'
              - 'pom.xml'
              - '.github/workflows/ci.yml'
            frontend-host:
              - 'frontend-host/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            frontend-admin:
              - 'frontend-admin/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            frontend-customer:
              - 'frontend-customer/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            frontend-rider:
              - 'frontend-rider/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            frontend-b2b:
              - 'frontend-b2b/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            shared-ui:
              - 'shared-ui/**'
              - '.github/workflows/ci.yml'
            governance:
              - 'homelab-ai-governance/**'
              - '.github/workflows/ci.yml'

  backend-quality:
    name: Backend Quality Gate (Test & Security)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Local Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Resolve Backend Maven Dependencies
        working-directory: ./backend
        run: mvn -q dependency:resolve

      - name: Run Backend Tests & Generate Coverage
        working-directory: ./backend
        run: |
          mvn clean test
          mvn jacoco:report

      - name: Enforce Code Coverage Gate (75% Minimum)
        working-directory: ./backend
        run: mvn jacoco:check

      - name: Spotless Code Style Gate (Google Java Format / AOSP)
        working-directory: ./backend
        run: mvn spotless:check

      - name: OWASP Dependency Security Check
        working-directory: ./backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "🔐 NVD API key provided — running dependency-check with NVD updates."
            mvn org.owasp:dependency-check-maven:check -Dnvd.apiKey="$NVD_API_KEY" -DfailBuildOnCVSS=7
          else
            echo "⚠️ WARNING: NVD API key not set. Skipping OWASP Dependency Check to avoid rate-limiting failures on empty databases."
            echo "To run this check, please configure the 'NVD_API_KEY' secret in your repository settings."
          fi

  microservices-quality:
    name: Microservices Quality Gate (Gateway, Core Business, Notification, Shared Async)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.microservices == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Local Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Resolve Maven Dependencies
        run: mvn -q dependency:resolve

      - name: Build All Microservices
        run: mvn clean package -DskipTests

  frontend-host-quality:
    name: Frontend Host Quality (Build & Lint)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend-host == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend-host/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-host
        run: npm ci

      - name: Run Biome Lint Gate (errors block; warnings allowed)
        working-directory: ./frontend-host
        run: npx @biomejs/biome lint .

      - name: Run ESLint Standards Validation
        working-directory: ./frontend-host
        run: npm run lint

      - name: Build MFE Assets for Production
        working-directory: ./frontend-host
        run: npm run build

  frontend-admin-quality:
    name: Frontend Admin Quality (Build & Lint)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend-admin == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-admin
        run: npm ci

      - name: Run ESLint Standards Validation
        working-directory: ./frontend-admin
        run: npm run lint

      - name: Build MFE Assets for Production
        working-directory: ./frontend-admin
        run: npm run build

  frontend-customer-quality:
    name: Frontend Customer Quality (Build & Lint)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend-customer == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend-customer/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-customer
        run: npm ci

      - name: Run ESLint Standards Validation
        working-directory: ./frontend-customer
        run: npm run lint

      - name: Build MFE Assets for Production
        working-directory: ./frontend-customer
        run: npm run build

  frontend-rider-quality:
    name: Frontend Rider Quality (Build & Lint)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend-rider == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend-rider/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-rider
        run: npm ci

      - name: Run ESLint Standards Validation
        working-directory: ./frontend-rider
        run: npm run lint

      - name: Build MFE Assets for Production
        working-directory: ./frontend-rider
        run: npm run build

  frontend-b2b-quality:
    name: Frontend B2B Quality (Build & Lint)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend-b2b == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend-b2b/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-b2b
        run: npm ci

      - name: Run ESLint Standards Validation
        working-directory: ./frontend-b2b
        run: npm run lint

      - name: Build MFE Assets for Production
        working-directory: ./frontend-b2b
        run: npm run build

  shared-ui-quality:
    name: Shared UI Design System Quality (Type-check, Lint & Test)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.shared-ui == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./shared-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./shared-ui
        run: npm ci

      - name: TypeScript Type-Check
        working-directory: ./shared-ui
        run: npm run type-check

      - name: Run Vitest Component Tests
        working-directory: ./shared-ui
        run: npm test

  cypress-e2e:
    name: Cypress E2E (auth, orders, rider, admin)
    runs-on: ubuntu-latest
    needs: [changes, backend-quality]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend-customer == 'true')

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: swiss_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: swisssecure2026
        ports:
          - 5420:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swiss_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-customer/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: mvn -q dependency:resolve

      - name: Start backend (staging profile, Postgres, background)
        working-directory: ./backend
        env:
          JWT_SECRET: ci-e2e-test-secret-32-chars-long!!
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          SPRING_DATA_REDIS_PASSWORD: ""
          ADMIN_EMAIL: ci-admin@swish.local
          ADMIN_PASSWORD: CiAdm1nP@ss!
          DB_SSL_MODE: disable
        run: |
          mvn spring-boot:run \
            -Dspring-boot.run.jvmArguments="-Dserver.port=8083" \
            -Dspring-boot.run.profiles=staging > backend_startup.log 2>&1 &
          echo "Backend PID: $!"
          for i in $(seq 1 30); do
            STATUS=$(curl -sf http://localhost:8083/actuator/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "?")
            echo "Attempt $i — health: $STATUS"
            [ "$STATUS" = "UP" ] && break
            sleep 3
          done
          if [ "$STATUS" != "UP" ]; then
            echo "=== BACKEND STARTUP LOG ==="
            cat backend_startup.log
            echo "==========================="
            echo "Backend did not start in time"
            exit 1
          fi

      - name: Fetch admin JWT for Cypress
        id: admin-jwt
        run: |
          ADMIN_TOKEN=""
          for i in $(seq 1 20); do
            RESP=$(curl -s -X POST http://localhost:8083/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"ci-admin@swish.local","password":"CiAdm1nP@ss!"}')
            ADMIN_TOKEN=$(printf '%s' "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || echo "")
            if [ -n "$ADMIN_TOKEN" ]; then
              echo "Admin JWT fetched on attempt $i (length ${#ADMIN_TOKEN})"
              break
            fi
            echo "Attempt $i — no token yet (admin seed not ready); response: ${RESP:-<empty>}"
            sleep 3
          done
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ERROR: could not obtain admin JWT after 20 attempts (admin user never seeded?)."
            exit 1
          fi
          echo "ADMIN_TOKEN=${ADMIN_TOKEN}" >> "$GITHUB_ENV"

      - name: Install Cypress dependencies
        working-directory: ./frontend-customer
        run: npm ci

      - name: Start Vite dev server (background)
        working-directory: ./frontend-customer
        env:
          VITE_API_URL: http://localhost:8083
        run: |
          npm run dev -- --port 5173 &
          sleep 8

      - name: Run Cypress E2E tests
        working-directory: ./frontend-customer
        env:
          CYPRESS_BASE_URL: http://localhost:5173
          CYPRESS_API_URL: http://localhost:8083
          CYPRESS_ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
        run: npm run cy:run -- --reporter junit --reporter-options "mochaFile=cypress/results/junit-[hash].xml"

      - name: Upload Cypress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            frontend-customer/cypress/results/
            frontend-customer/cypress/screenshots/
          retention-days: 7

  security-trivy:
    name: FileSystem Vulnerability Audit (Trivy)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.microservices == 'true' ||
      needs.changes.outputs.frontend-host == 'true' ||
      needs.changes.outputs.frontend-admin == 'true' ||
      needs.changes.outputs.frontend-customer == 'true' ||
      needs.changes.outputs.frontend-rider == 'true' ||
      needs.changes.outputs.frontend-b2b == 'true' ||
      needs.changes.outputs.governance == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  governance-quality:
    name: AI Governance Quality Gate (Python)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.governance == 'true'
    defaults:
      run:
        working-directory: ./homelab-ai-governance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ./homelab-ai-governance/pyproject.toml

      - name: Install governance package + dev deps
        run: |
          pip install -e ".[dev]"
          # Canonical red-team tool (repo root); scripts/redteam.py shims to it.
          pip install -e ../agentic-redteam

      - name: Run governance test suite
        env:
          SWISH_TRACING_ENABLED: 'false'
        run: pytest tests/ -q

      - name: Set up Node.js (for Promptfoo)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start governance server for red-team evaluation
        env:
          SWISH_TRACING_ENABLED: 'false'
          # No live Ollama in CI: opt into deterministic mock responses so the
          # red-team exercises the guardrail GATES (which run before any model).
          # Model-COMPLIANCE red-teaming needs real models → run locally/staging.
          GOVERNANCE_ALLOW_MOCK_FALLBACK: '1'
        run: |
          pip install -e "." --quiet
          bash dev/start_governance_server.sh &
          # Give server time to boot (start_governance_server.sh waits for /health internally)
          sleep 5

      # Network-independent red-team via the vendored harness (scripts/redteam.py).
      # Replaces the previous `npx promptfoo` steps, which (a) routinely failed to
      # install promptfoo's native deps on flaky networks and (b) ran each bare
      # category file with `--config <test-list> --providers http` (no valid
      # provider) under `|| true`, so the job passed while testing nothing.
      # --ci exits non-zero if any CRITICAL category (prompt_injection, pii_leakage,
      # jailbreak) has a failure, so the red-team genuinely gates the build.
      - name: Run governance red-team suite
        run: python scripts/redteam.py --ci

      - name: Stop governance server
        if: always()
        run: bash dev/stop_governance_server.sh || true

      - name: Upload Promptfoo reports as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-red-team-reports
          path: homelab-ai-governance/promptfoo/results/
          retention-days: 30
