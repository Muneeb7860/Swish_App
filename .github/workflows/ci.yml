name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Run Maven Tests
        working-directory: ./backend
        run: mvn test

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mfe: [frontend-host, frontend-admin, frontend-customer, frontend-rider]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies and build
        working-directory: ./${{ matrix.mfe }}
        run: |
          npm install
          npm run build
