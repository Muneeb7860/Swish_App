# Swish — one-command demo/closed-beta INFRA + FRONTEND ("Mac as server", hybrid).
# Backend runs natively (spring-boot:run, arm64) via demo/start.sh — the deploy image's
# alpine base has no arm64 manifest. Infra + frontend are containers (restart-resilient).
name: swish-demo
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_DB: swiss_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: swisssecure2026 }
    volumes: ["swish_demo_pgdata:/var/lib/postgresql/data"]
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres -d swiss_db"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server","--requirepass","redissecurepassword"]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD","redis-cli","-a","redissecurepassword","ping"], interval: 10s, timeout: 3s, retries: 10 }
    restart: unless-stopped

  mongo:
    image: mongo:6
    ports: ["27017:27017"]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]
    restart: unless-stopped

  frontend:
    build: { context: ., dockerfile: demo/frontend.Dockerfile }
    ports: ["3000:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./demo/auth:/etc/nginx/auth:ro"]
    restart: unless-stopped

volumes:
  swish_demo_pgdata:
