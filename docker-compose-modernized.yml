version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 256M

  clickhouse:
    # Pinned to an LTS tag for reproducible builds (avoid :latest drift).
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      # Credentials come from the environment (e.g. a local .env), not the repo.
      # Defaults are obvious non-secrets for first-run local dev only — override
      # CLICKHOUSE_PASSWORD before exposing this beyond localhost.
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-changeme_local_only}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-swish_audit}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  qdrant_data:
  clickhouse_data:

networks:
  hybrid-net:
    driver: bridge
