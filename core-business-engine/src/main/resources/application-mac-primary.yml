spring:
  config:
    activate:
      on-profile: mac-primary

  datasource:
    url: jdbc:postgresql://localhost:5432/b2b_qcomm
    username: ${DB_USER:postgres}
    password: ${DB_PASS:secure_postgres_pass}
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8

  data:
    mongodb:
      uri: mongodb://localhost:27017/shared_services_db
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  # Spring Cloud Stream Abstraction Layer replacing Debezium Architecture
  cloud:
    stream:
      function:
        definition: outboxRelayProcessor
      bindings:
        outboxRelayProcessor-out-0:
          destination: enterprise.order.events
          content-type: application/json
          binder: local-kafka
        checkoutProcessor-out-0:
          destination: enterprise.payment.events
          content-type: application/json
        b2b-wholesale-out-0:
          destination: b2b.wholesale.order.placed
          content-type: application/json
          binder: local-kafka
        processEvaluatedOrder-in-0:
          destination: b2b.wholesale.order.evaluated
          group: core-b2b-group
          content-type: application/json
          binder: local-kafka
      binders:
        local-kafka:
          type: kafka
          environment:
            spring:
              cloud:
                stream:
                  kafka:
                    binder:
                      brokers: localhost:9092
                      zkNodes: localhost:2181

  ai:
    ollama:
      # Routing inference over the 20Gbps USB4 bridge to the Dell Laptop
      base-url: http://169.254.1.2:11434
      chat:
        options:
          model: qwen2.5:7b # or qwen3.5:9b running on Dell OpenVINO
          temperature: 0.0
          format: json

# Virtual Threading Execution Matrix (Project Loom Optimization)
server:
  port: 8081
  tomcat:
    threads:
      max: 10 # Drastically lowered because Virtual Threads handle execution concurrency
  project-loom:
    enabled: true
