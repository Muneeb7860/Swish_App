server:
  port: 8081

spring:
  application:
    name: core-business-engine
  threads:
    virtual:
      enabled: true # Enables Loom Virtual Threads
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/b2b_qcomm
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:adminpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    function:
      definition: checkoutProcessor
    stream:
      bindings:
        checkoutProcessor-out-0:
          destination: b2b.checkout.events
      kafka:
        binder:
          brokers: localhost:9092
