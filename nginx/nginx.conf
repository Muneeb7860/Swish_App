events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Hide Nginx version
    server_tokens off;

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "DENY";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' http://localhost:8081 ws://localhost:8081 'unsafe-inline' 'unsafe-eval';";

        # Route to MFE Host Shell (Default)
        location / {
            root /usr/share/nginx/html/host;
            try_files $uri $uri/ /index.html;
        }

        # Route to Customer MFE
        location /customer/ {
            alias /usr/share/nginx/html/customer/;
            try_files $uri $uri/ /customer/index.html;
        }

        # Route to Admin MFE
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
        }

        # Route to Rider MFE
        location /rider/ {
            alias /usr/share/nginx/html/rider/;
            try_files $uri $uri/ /rider/index.html;
        }

        # Route to BFF Gateway (API Calls and SSE Telemetry Streams)
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://bff:8081;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Core Streaming Settings for Server-Sent Events (SSE)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }
    }
}
