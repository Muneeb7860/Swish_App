server:
  port: 8082

spring:
  application:
    name: notification-engine
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    stream:
      function:
        definition: broadcastNotification
      bindings:
        broadcastNotification-in-0:
          destination: b2b.wholesale.order.evaluated
          group: notification-b2b-group
          content-type: application/json
          binder: local-kafka
          consumer:
            max-attempts: 3
      kafka:
        bindings:
          broadcastNotification-in-0:
            consumer:
              enableDlq: true
              dlqName: b2b.wholesale.order.evaluated.DLQ
              autoCommitOnError: false
        binder:
          brokers: localhost:9092
      binders:
        local-kafka:
          type: kafka
          environment:
            spring:
              cloud:
                stream:
                  kafka:
                    binder:
                      brokers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
