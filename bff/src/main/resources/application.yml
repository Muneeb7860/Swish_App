server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://zipkin:9411/api/v2/spans"

spring:
  application:
    name: swiss-qcommerce-bff
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth_route
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: SecureHeaders
            - name: RateLimiterFilter
              args:
                capacity: 5
                refillRatePerSecond: 1
        - id: backend_route
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/**
          filters:
            - name: SecureHeaders
            - name: EdgeJwtVerificationFilter
            - name: RateLimiterFilter
              args:
                capacity: 30
                refillRatePerSecond: 10
            - name: CircuitBreaker
              args:
                name: backendCircuitBreaker
                fallbackUri: ${FALLBACK_URL:forward:/fallback}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

resilience4j:
  circuitbreaker:
    instances:
      backendCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      backendCircuitBreaker:
        timeoutDuration: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: BFF Gateway APIs
        url: /v3/api-docs
      - name: Core Backend APIs
        url: /api/v3/api-docs
    enabled: true
