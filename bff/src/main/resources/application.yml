server:
  port: 8081

spring:
  application:
    name: swiss-qcommerce-bff
  cloud:
    gateway:
      cors-configurations:
        '[/**]':
          allowedOrigins:
            - "http://localhost:3000"
            - "http://localhost:3001"
            - "http://localhost:3002"
            - "http://localhost:3003"
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          allowedHeaders: "*"
          allowCredentials: true
      routes:
        - id: backend_route
          uri: http://localhost:8080
          predicates:
            - Path=/api/**
