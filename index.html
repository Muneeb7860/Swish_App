  <script>
    const oldError = console.error;
    console.error = function() {
      var msgs = Array.from(arguments).join(' ');
      if (msgs.includes('React DevTools') || msgs.includes('favicon')) { oldError.apply(console, arguments); return; }
      var div = document.createElement('div');
      div.style = "color:white; background:#ef4444; padding: 20px; font-size: 16px; position:absolute; z-index:99999; top:0; left:0; width:100%; font-family:sans-serif;";
      div.innerHTML = '<h2>🚨 Console.Error Caught!</h2><pre style="background:#450a0a; padding:10px; overflow:auto;">' + msgs + '</pre>';
      document.body.appendChild(div);
      oldError.apply(console, arguments);
    };
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      if (msg === 'Script error.') return false; // Ignore masked CORS errors now
      var div = document.createElement('div');
      div.style = "color:white; background:#ef4444; padding: 20px; font-size: 16px; position:absolute; z-index:99999; top:0; left:0; width:100%; font-family:sans-serif;";
      div.innerHTML = '<h2>🚨 UI Execution Error</h2><p><strong>Message:</strong> ' + msg + '</p>' +
        '<p><strong>Location:</strong> Line ' + lineNo + ' Column ' + columnNo + '</p>' +
        '<pre style="background:#450a0a; padding:10px; overflow:auto;">' + (error && error.stack ? error.stack : 'No stack trace') + '</pre>';
      document.body.appendChild(div);
      return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
      var div = document.createElement('div');
      div.style = "color:white; background:#ef4444; padding: 20px; font-size: 16px; position:absolute; z-index:99999; top:0; left:0; width:100%; font-family:sans-serif;";
      div.innerHTML = '<h2>🚨 Unhandled Promise Rejection</h2><p><strong>Reason:</strong> ' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '</p>' +
        '<pre style="background:#450a0a; padding:10px; overflow:auto;">' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre>';
      document.body.appendChild(div);
    });
  </script>

            const activeProfileMatch = envText.match(/ACTIVE_PROFILE\s*=\s*([a-zA-Z0-9_-]+)/i);

              const value = cleaned.substring(eqIndex + 1).trim();
              parsedConfig[key] = value;

          isAllowed = term.includes('error') || term.includes('critical') || term.includes('breach') || term.includes('failed') || term.includes('alert') || term.includes('violation') || term.includes('blocked') || term.includes('refused') || term.includes('voided');

          const term = (event + ' ' + source).toLowerCase();
          isAllowed = !term.includes('keystroke') && !term.includes('cache.hit') && !term.includes('autocomplete');

          setConsecutiveFailures(f => f + 1);
          if (paymentMethod === 'Swipe') {
            logKafka('system', 'payment.fallback_routing', 'Swipe gateway timeout (504). Automatically routing payment to backup PayPal route.');
            triggerToast('Swipe Timeout: Automatically routed payload to backup PayPal gateway.', 'system');
            selectedGateway = 'PayPal';
          } 
          if (selectedGateway === 'PayPal' && paymentOutageActive) {
            logKafka('system', 'payment.fallback_routing', 'PayPal gateway timeout (504). Automatically downgrading transaction to Cash on Delivery (COD).');
            triggerToast('PayPal Timeout: Downgraded transaction to Cash on Delivery.', 'system');
            selectedGateway = 'COD';
          }
        }

        // Calculate Cart Totals (including tips & rebates)
        const itemsTotal = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
        const deliverySurcharge = weatherStats.surcharge;
        const esgRebate = esgCheckbox ? 0.50 : 0.00;
        const customerChargeTotal = itemsTotal + deliverySurcharge + tipAmount - esgRebate;

        if (selectedGateway === 'Wallet' && customerWallet < customerChargeTotal) {
          triggerToast('Insufficient funds in wallet! Please top up.', 'customer');
          return;
        }

        // 2. Multi-Store Stock Check and Re-routing
        let stockValid = true;
        let routedFromEast = false;
        
        setProducts(prevProducts => {
          cart.forEach(cartItem => {
            const prod = prevProducts.find(p => p.id === cartItem.product.id);
            if (!prod) {
              stockValid = false;
              return;
            }
            const forceEastDueToCongestion = pickingBacklogQueue > 1 && prod.stockEast >= cartItem.quantity;
            if (prod.stock < cartItem.quantity || forceEastDueToCongestion) {
              if (prod.stockEast >= cartItem.quantity) {
                routedFromEast = true;
              } else {
                if (prod.stock < cartItem.quantity) {
                  stockValid = false;
                }
              }
            }
          });

          if (!stockValid) return prevProducts;

          return prevProducts.map(p => {
            const cartItem = cart.find(c => c.product.id === p.id);
            if (cartItem) {
              const useEast = routedFromEast && p.stockEast >= cartItem.quantity;
              if (useEast) {
                const nextStockEast = p.stockEast - cartItem.quantity;
                return { ...p, stockEast: nextStockEast };
              } else {
                const nextStock = p.stock - cartItem.quantity;
                if (nextStock < 3) {
                  triggerB2bProcurement(p.name);
                }
                return { ...p, stock: nextStock };
              }
            }
            return p;
          });
        });

        if (!stockValid) {
          triggerToast('Fulfillment Error: One or more items sold out during checkout.', 'inventory');
          return;
        }

        // 3. Apply ESG recycling paper bag rebate
        if (esgCheckbox) {
          setCustomerWallet(w => w + 0.50);
          setMerchantWallet(m => m - 0.50);
          setTotalCo2Offset(co2 => co2 + 250);
          logLedger('customer', 'ESG-REBATE', 'Customer received bag return cash rebate', 0, 0.50);
          logLedger('system', 'ESG-DEBIT', 'Merchant paid bag return rebate', 0.50, 0);
          logKafka('customer', 'esg.recycle_bag', 'Returned previous order bag: +250g CO2 Offset recorded.');
        }

        // 4. Charge wallet/card & credit merchant
        if (selectedGateway === 'Wallet') {
          setCustomerWallet(w => w - customerChargeTotal);
          logLedger('customer', 'CUST-CHKT', `Express checkout order payment via Wallet`, customerChargeTotal, 0);
        } else {
          logLedger('customer', `EXT-${selectedGateway.toUpperCase()}`, `Card hold deposit via ${selectedGateway}`, 0, customerChargeTotal);
          logLedger('customer', `EXT-CUST-CHKT`, `Express checkout payment via ${selectedGateway}`, customerChargeTotal, 0);
        }
        setMerchantWallet(m => m + customerChargeTotal);
        logLedger('system', `MERCH-CR-${selectedGateway.toUpperCase()}`, `Received customer payment for order`, 0, customerChargeTotal);

        // 5. Transfer Rider tips
        if (tipAmount > 0) {
          setCustomerWallet(w => w - tipAmount);
          setRiderWallet(r => r + tipAmount);
          logLedger('customer', 'CUST-TIP', `Rider tip paid by customer`, tipAmount, 0);
          logLedger('rider', 'RIDER-TIP-CR', `Rider received tip from order`, 0, tipAmount);
          logKafka('customer', 'wallet.tip_transferred', `Transferred $${tipAmount.toFixed(2)} tip to Rider.`);
        }

        // 6. Apply Weather Surge Rider Bonus
        let weatherSurgePay = 0;
        if (weather !== 'Sunny') {
          weatherSurgePay = 3.00;
          setMerchantWallet(m => m - 3.00);
          setRiderWallet(r => r + 3.00);
          logLedger('system', 'MERCH-SURGE-PAY', `Merchant paid dynamic weather surge bonus to Rider`, 3.00, 0);
          logLedger('rider', 'RIDER-SURGE-CR', `Rider weather surge payout`, 0, 3.00);
          logKafka('system', 'rider.surge_paid', `Issued $3.00 Weather Surge incentive to Rider.`);
        }

        const orderId = Math.floor(1000 + Math.random() * 9000);
        const points = Math.floor(customerChargeTotal * 2);

        // 7. Calculate Elastic SLA & Dynamic Batching duration
        let baseSlaSeconds = 540 + weatherStats.etaBonus;
        let batchOverhead = 0;
        let isBatched = false;
        
        if (activeOrder && activeOrder.status !== 'delivered') {
          isBatched = true;
          batchOverhead = 180; // add 3 minutes for batch routing
          logKafka('system', 'delivery.order_batched', `Dynamic Dispatcher: Batched Order #${orderId} with Order #${activeOrder.id} due to close distance coordinates.`);
          triggerToast('BATCHING ACTIVATED: Route grouped with another order!', 'rider');
        }

        if (routedFromEast) {
          batchOverhead += 240; // add 4 minutes for East Store rerouting overhead
          const isCongestionRoute = pickingBacklogQueue > 1;
          logKafka('system', 'delivery.east_store_routed', `Multi-Store Routing: Routed Order #${orderId} to East Dark Store due to ${isCongestionRoute ? 'Central store picker congestion' : 'Central stockout'}.`);
          if (isCongestionRoute) {
            triggerToast('CONGESTION BYPASS: Routed checkout to East MFC.', 'customer');
          }
        }
        
        const finalSlaSeconds = baseSlaSeconds + batchOverhead;
        setSlaSecondsRemaining(finalSlaSeconds);

        const orderObj = {
          id: orderId,
          items: cart,
          total: Number(customerChargeTotal.toFixed(2)),
          status: 'pending',
          paymentMethod: selectedGateway,
          pointsEarned: points,
          eta: Math.ceil(finalSlaSeconds / 60),
          routedFromEast,
          isBatched,
          tip: tipAmount,
          weatherSurge: weatherSurgePay
        };

        setActiveOrder(orderObj);
        if (activeOrder && activeOrder.status !== 'delivered') {
          setPickingBacklogQueue(q => {
            const nextQ = q + 1;
            if (nextQ > 1) {
              setActivePickingCongested(true);
            }
            return nextQ;
          });
        }
        setCustomerOrderCount(c => c + 1);
        setCart([]);
        setRiderProgress(0);
        setTipAmount(0); // reset tipping state
        setEsgCheckbox(false); // reset recycling state
        
        logKafka('customer', 'order.placed', `Order #${orderId} generated. Total: $${orderObj.total}`);
        logKafka('system', 'inventory.updated', `Stock reservation applied for Order #${orderId}`);
        triggerToast(`Order #${orderId} successfully placed! Routed to nearest Dark Store.`, 'customer');
      };

      // --- AUTOMATED B2B PROCURE TRIGGER WITH HITL BARRIER ---
      const triggerB2bProcurement = (itemName) => {
        const id = 'B2B-' + Math.floor(100 + Math.random() * 900);
        
        setB2bOrders(prev => [...prev, { id, itemName, progress: 0, status: 'pending_hitl' }]);
        logKafka('inventory', 'b2b.procure_triggered', `Auto B2B check: "${itemName}" fell below 3 items. Creation of funding release.`);
        
        const isFallback = wholesalerOutageActive;
        const amount = isFallback ? 35.00 : 25.00;
        if (isFallback) {
          updateWholesalerTrust(-20, 'Primary Wholesaler Outage: Fallback Surcharge');
          logKafka('inventory', 'b2b.fallback_activated', `Primary wholesaler stockout! Failover B2B restocking routed to Secondary Wholesaler. Charge +$10 surcharge.`);
          triggerToast(`AUTO B2B Outage! Failover routed to Secondary Wholesaler (+$10.00 surcharge).`, 'inventory');
        }

        setHitlQueue(prev => [...prev, {
          id: 'HITL-' + Date.now(),
          type: 'b2b_payment',
          desc: `Release funds to ${isFallback ? 'Secondary' : 'Primary'} Wholesaler for 15x "${itemName}" restocking`,
          amount: amount,
          actionData: { b2bId: id, itemName, isFallback }
        }]);

        if (!isFallback) {
          triggerToast(`AUTO B2B: Stock alert! Created pending wholesaler payment for ${itemName}.`, 'inventory');
        }
      };

      // --- INTERACTIVE PICKING ITEM REPLACEMENT ENGINE ---
      const handleSubstituteRequest = (itemName) => {
        // Suggest a replacement item based on category
        const suggestion = itemName === 'Organic Fresh Milk' ? 'Free Range Eggs (Dozen)' : 'Fresh Hass Avocado (Pair)';
        setReplacementRequest({ itemName, suggestedItem: suggestion });
        logKafka('inventory', 'pick.substitute_requested', `Dark Store picker suggests swapping "${itemName}" for "${suggestion}"`);
        triggerToast(`Requested customer approval to swap ${itemName} for ${suggestion}.`, 'inventory');
      };

      const handleAcceptReplacement = () => {
        if (!replacementRequest || !activeOrder) return;
        
        validateJwt();
        const targetSuggestion = products.find(p => p.name === replacementRequest.suggestedItem);
        
        setActiveOrder(prev => {
          const updatedItems = prev.items.map(i => {
            if (i.product.name === replacementRequest.itemName) {
              return { ...i, product: targetSuggestion };
            }
            return i;
          });
          return { ...prev, updatedItems };
        });

        logKafka('customer', 'pick.substitute_approved', `Approved: Swapped "${replacementRequest.itemName}" for "${replacementRequest.suggestedItem}"`);
        triggerToast(`Substitution approved! Swapped for ${replacementRequest.suggestedItem}.`, 'customer');
        setReplacementRequest(null);
      };

      const handleDeclineReplacement = () => {
        if (!replacementRequest || !activeOrder) return;
        
        validateJwt();
        // Remove item from order and refund customer
        const targetProduct = products.find(p => p.name === replacementRequest.itemName);
        const orderItem = activeOrder.items.find(i => i.product.name === replacementRequest.itemName);
        const refundAmt = orderItem ? orderItem.product.price * orderItem.quantity : 0;

        setActiveOrder(prev => {
          const updatedItems = prev.items.filter(i => i.product.name !== replacementRequest.itemName);
          const nextTotal = Number((prev.total - refundAmt).toFixed(2));
          return { ...prev, items: updatedItems, total: nextTotal };
        });

        // Credit customer wallet
        setCustomerWallet(w => w + refundAmt);
        logLedger('system', 'REF-SUB-DECLINE', `Refund for declined item substitute in Order #${activeOrder.id}`, refundAmt, 0);
        logLedger('customer', 'REF-SUB-DECLINE-CR', `Refund credit for out-of-stock ${replacementRequest.itemName}`, 0, refundAmt);

        logKafka('customer', 'pick.substitute_declined', `Declined: Refunded $${refundAmt.toFixed(2)} for out-of-stock "${replacementRequest.itemName}"`);
        triggerToast(`Substitution declined. Refunded $${refundAmt.toFixed(2)} to wallet.`, 'customer');
        
        // Trigger automatic B2B replenishment order for that product to restock the Dark Store
        triggerB2bProcurement(replacementRequest.itemName);
        
        setReplacementRequest(null);
      };

      // --- ACTIONS: Release HITL payments ---
      const handleReleaseHitl = (ticket) => {
        setHitlQueue(prev => prev.filter(t => t.id !== ticket.id));
        validateJwt();

        if (ticket.type === 'b2b_payment') {
          const finalAmt = b2bDiscountActive ? ticket.amount * 0.9 : ticket.amount;
          setMerchantWallet(w => w - finalAmt);
          logLedger('system', `B2B-DEBIT`, `Merchant B2B procurement cost${b2bDiscountActive ? ' (10% Academy Discount)' : ''}: 15x "${ticket.actionData.itemName}"`, finalAmt, 0);
          logLedger('system', `B2B-CREDIT`, `Wholesale supplier invoice paid`, 0, finalAmt);

          setB2bOrders(prev => prev.map(ord => ord.id === ticket.actionData.b2bId ? { ...ord, status: 'shipping' } : ord));
          
          logKafka('system', 'hitl.authorized', `Admin authorized B2B Funds: $${ticket.amount.toFixed(2)} transferred to wholesaler.`);
          triggerToast(`Authorized payment of $${ticket.amount.toFixed(2)}. Supply truck dispatched!`, 'system');
        } else if (ticket.type === 'refund_customer') {
          setCustomerWallet(w => w + ticket.amount);
          setCustomerRefundCount(r => r + 1);
          logLedger('system', `REFUND-DEBIT`, `Self-service AI refund approved`, ticket.amount, 0);
          logLedger('customer', `REFUND-CREDIT`, `Customer credit release for ticket`, 0, ticket.amount);

          logKafka('system', 'hitl.authorized', `Admin authorized Support Bot refund of $${ticket.amount.toFixed(2)} to customer.`);
          triggerToast(`Authorized customer refund of $${ticket.amount.toFixed(2)}`, 'system');
        }
      };

      const handleVoidHitl = (ticket) => {
        setHitlQueue(prev => prev.filter(t => t.id !== ticket.id));
        if (ticket.type === 'b2b_payment') {
          setB2bOrders(prev => prev.filter(ord => ord.id !== ticket.actionData.b2bId));
          logKafka('admin', 'hitl.voided', `Admin VOIDED B2B procurement request for ${ticket.actionData.itemName}`);
        } else {
          logKafka('admin', 'hitl.voided', 'Admin VOIDED AI Bot customer refund request.');
        }
        triggerToast('Transaction request voided.', 'admin');
      };

      const handleFulfillOrder = () => {
        if (!activeOrder) return;
        
        let duration = 3.2;
        if (activePickingCongested) {
          duration = 6.8;
          setPickerBadge('Congested');
        } else {
          duration = backupPickersCount > 0 ? 2.1 : 3.2;
          if (duration < 4.0) {
            setPickerBadge('Lightning');
          } else {
            setPickerBadge('Standard');
          }
        }
        setPickerSlaDuration(duration);
        
        const hasError = Math.random() < 0.05;

        setActiveOrder(prev => ({ 
          ...prev, 
          status: 'picking',
          pickingStartTime: Date.now(),
          pickerSla: duration,
          packingError: hasError
        }));

        logKafka('inventory', 'order.picking_started', `Fulfillment picklist issued for Order #${activeOrder.id}. SLA target: ${duration}s. Badge: ${duration < 4.0 ? 'Lightning' : 'Congested'}`);
        triggerToast(`Picker started. Estimated picking time: ${duration}s`, 'inventory');
      };

      const handleHandoverRider = () => {
        if (!activeOrder) return;

        const elapsed = activeOrder.pickingStartTime ? ((Date.now() - activeOrder.pickingStartTime) / 1000).toFixed(1) : pickerSlaDuration;
        const finalDuration = parseFloat(elapsed) > 0 ? parseFloat(elapsed) : pickerSlaDuration;
        
        let badge = 'Standard';
        if (finalDuration < 4.0) {
          badge = 'Lightning';
          setMerchantWallet(w => w - 1.00);
          updatePickerTrust(10, `Lightning Picker Badge on Order #${activeOrder.id}`);
          logLedger('system', 'PICKER-BONUS', `Merchant paid Picker Lightning speed bonus`, 1.00, 0);
          logKafka('inventory', 'picker.bonus_awarded', `SLA Gamification: Picker earned "Lightning Picker" badge on Order #${activeOrder.id}. Paid $1.00 bonus.`);
        } else if (activePickingCongested) {
          badge = 'Congested';
        }
        setPickerBadge(badge);
        setPickerSlaDuration(finalDuration);

        setActiveOrder(prev => ({ ...prev, status: 'picked' }));
        logKafka('inventory', 'order.handover', `Order #${activeOrder.id} ready. Dispatching courier. Pick time: ${finalDuration}s.`);
        triggerToast(`Order packed in ${finalDuration}s! Handoff complete.`, 'inventory');

        setPickingBacklogQueue(q => Math.max(0, q - 1));
        if (pickingBacklogQueue <= 1) {
          setActivePickingCongested(false);
        }
      };

      const handleDeployBackupPicker = () => {
        if (merchantWallet < 10.00) {
          triggerToast('Insufficient merchant funds to deploy backup picker!', 'admin');
          return;
        }
        setMerchantWallet(w => w - 10.00);
        setBackupPickersCount(c => c + 1);
        setActivePickingCongested(false);
        setPickingBacklogQueue(0);
        setPickerBadge('Lightning');
        setPickerSlaDuration(2.1);
        logLedger('system', 'BACKUP-PICKER-DEBIT', 'Deployed backup picker (operations wage expense)', 10.00, 0);
        logKafka('inventory', 'picker.backup_deployed', 'Operations Control: Deployed backup picker. Cleared picker queue backlog.');
        triggerToast('Deployed backup picker! Congestion cleared.', 'inventory');
      };

      const exportOlapLedger = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "ID,Time,Type,Ref Code,Description,Debit,Credit\n";
        ledger.forEach(log => {
          const row = [
            log.id,
            log.time,
            log.type,
            `"${log.ref}"`,
            `"${log.desc}"`,
            log.debit || 0,
            log.credit || 0
          ].join(",");
          csvContent += row + "\n";
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "swiss-audit-ledger.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        logKafka('system', 'etl.export_csv', 'OLAP Export: Compiled regulatory double-entry ledger database into CSV format.');
        triggerToast('Audit ledger CSV exported successfully!', 'business');
      };

      const handleBalanceStores = () => {
        const transfers = [];
        let transferTriggered = false;
        
        products.forEach(p => {
          if (Math.abs(p.stock - p.stockEast) > 3) {
            const fromStore = p.stock > p.stockEast ? 'Central' : 'East';
            const toStore = fromStore === 'Central' ? 'East' : 'Central';
            const transferQty = 5;
            const transferId = 'XFER-' + Math.floor(100 + Math.random() * 900);
            
            transfers.push({
              id: transferId,
              productName: p.name,
              from: fromStore,
              to: toStore,
              qty: transferQty,
              progress: 0
            });
            
            setProducts(prevProducts => prevProducts.map(prod => {
              if (prod.id === p.id) {
                if (fromStore === 'Central') {
                  return { ...prod, stock: prod.stock - transferQty };
                } else {
                  return { ...prod, stockEast: prod.stockEast - transferQty };
                }
              }
              return prod;
            }));
            
            logKafka('inventory', 'inventory.transfer_started', `Stock Balancing: Dispatched transfer truck ${transferId} carrying ${transferQty}x "${p.name}" from ${fromStore} to ${toStore}.`);
            triggerToast(`STOCK BALANCING: Dispatching truck for ${p.name} from ${fromStore} to ${toStore}.`, 'inventory');
            transferTriggered = true;
          }
        });

        if (transferTriggered) {
          setActiveStockTransfers(prev => [...prev, ...transfers]);
        } else {
          triggerToast('Stock levels already balanced across stores.', 'inventory');
        }
      };

      const handleRestock = () => {
        setProducts(INITIAL_PRODUCTS.map(p => ({ ...p, stock: p.stock + 15 })));
        logKafka('inventory', 'catalog.restocked', 'Manual warehouse replenishment trigger received.');
        triggerToast('All warehouse inventory stocks replenished!', 'inventory');
      };

      const handleTopUp = () => {
        setCustomerWallet(w => w + 20.00);
        logLedger('customer', 'CUST-LOAD', 'Customer wallet reload (Visa card payment)', 0, 20.00);
        logKafka('customer', 'wallet.topup', 'Credited $20.00 via Swipe Payment Gateway.');
        triggerToast('Loaded $20.00 into digital wallet.', 'customer');
      };

      const handleRedeemPoints = () => {
        if (customerPoints < 100) {
          triggerToast('You need at least 100 points to redeem a discount coupon!', 'customer');
          return;
        }
        setCustomerPoints(p => p - 100);
        setCustomerWallet(w => w + 5.00);
        logLedger('customer', 'PTS-REDEEM', 'Loyalty points exchange ($5 coupon credit)', 0, 5.00);
        logKafka('customer', 'loyalty.redeem', 'Exchanged 100 loyalty tokens for $5.00 wallet credit.');
        triggerToast('Redeemed 100 points for $5.00 wallet credit!', 'customer');
      };

      // --- AI MULTIMODAL SUPPORT BOT CONTROLLER WITH FRAUD SHIELD ---
      const handleSendBotMessage = (simulatedAttachment = null) => {
        if (!botInputText.trim() && !simulatedAttachment) return;

        const userText = botInputText;
        const newMsg = { sender: 'user', text: userText };
        if (simulatedAttachment) {
          newMsg.attachmentUrl = simulatedAttachment;
        }
        
        setBotMessages(prev => [...prev, newMsg]);
        setBotInputText('');

        setTimeout(() => {
          let botResponse = "I've logged this ticket to our Business operations team. Can I help you with anything else?";
          const prompt = userText.toLowerCase();

          if (activeRole === 'rider') {
            if (prompt.includes('breakdown') || prompt.includes('accident') || simulatedAttachment) {
              botResponse = `🚨 EMERGENCY DISPATCH: Vehicle breakdown/accident detected. Automatically routing backup rider to salvage cargo. Transit SLA paused. Incident report logged.`;
              logKafka('rider', 'rider.incident_reported', 'Emergency: Rider reported vehicle incident / road obstacle.');
              updateRiderTrust(-5, 'Vehicle Incident Reported');
              
              setHitlQueue(prev => [...prev, {
                id: 'RIDER-INCIDENT-' + Date.now(),
                type: 'rider_emergency',
                desc: 'Rider reported vehicle breakdown / accident checklist salvage dispatch',
                amount: 15.00
              }]);
              triggerToast('EMERGENCY: Rider reported incident! Backup dispatched.', 'admin');
            } else if (prompt.includes('traffic') || prompt.includes('blocked') || prompt.includes('delay')) {
              botResponse = `🚦 TRAFFIC ALERT: Congestion detected on primary route. Alternative GPS route generated: Take Expressway bypass. Verify perishable seal and temperature sensor.`;
              logKafka('rider', 'rider.rerouted', 'GPS Routing: Alternative route suggested to avoid road blocks.');
            } else if (prompt.includes('temperature') || prompt.includes('warm') || prompt.includes('iot')) {
              botResponse = `🌡️ IoT THERMAL ALERT: Perishable items are warming up. Verify container seal. If temperature exceeds 8.0°C, click the "Inject Dry Ice ($2.00)" button in your Rider Navigation Panel.`;
            } else {
              botResponse = `Copilot: Traffic is normal on your route. Continue driving safely and keep your speed within safety regulations.`;
            }
          } else if (activeRole === 'inventory') {
            if (prompt.includes('damaged') || prompt.includes('spoiled') || simulatedAttachment) {
              botResponse = `🍌 ITEM DAMAGE LOGGED: Damaged produce reported. Auto-dispatched a B2B replenishment reorder for safety. Damaged items written off.`;
              logLedger('system', 'SHELF-DAMAGE', 'Merchant written off damaged inventory items', 4.50, 0);
              logKafka('inventory', 'inventory.item_damaged', 'Inventory Audit: Picker reported damaged shelf produce. Restocked B2B.');
              
              setProducts(prev => prev.map(p => p.id === 'p2' ? { ...p, stock: Math.max(0, p.stock - 2) } : p));
              triggerB2bProcurement('Chiquita Bananas (1kg)');
              triggerToast('SHELF AUDIT: Damaged item logged and written off.', 'inventory');
            } else if (prompt.includes('out of stock') || prompt.includes('empty')) {
              botResponse = `📦 STOCKOUT ALERT: Selected item stock is critically low. If stock is empty, checkout will route dynamically to East MFC. Triggering automated B2B replenishment.`;
              triggerB2bProcurement('Organic Fresh Milk');
            } else if (prompt.includes('congested') || prompt.includes('backlog') || prompt.includes('slow')) {
              botResponse = `⚡ CONGESTION ASSIST: Dark Store backlog exceeds 1 order. Click the "Deploy Backup Picker ($10.00)" button in your Picker Console to clear queue backlog and speed up picking to 2.1s.`;
            } else {
              botResponse = `Assistant: Store shelves are currently balanced. Keep picking at lightning speeds to maintain your SLA badges!`;
            }
          } else {
            if (prompt.includes('refund') || prompt.includes('expired') || prompt.includes('bad') || simulatedAttachment) {
              if (gdprTokenProbation) {
                botResponse = `⛔ REFUND REFUSED: Your account is currently under GDPR Anonymization Probation (Trust Score: ${customerTrustScore}/100). Automated refunds are disabled during probation. You must complete 3 successful orders without refund claims to lift probation.`;
                logKafka('system', 'fraud.probation_block', `Abuse Shield Blocked Refund: Account is under GDPR probation.`);
                triggerToast('FRAUD SHIELD: Blocked refund request due to GDPR probation.', 'admin');
              } else if (customerTrustScore < 65) {
                botResponse = `⛔ REFUND REFUSED: Your Customer Trust Score (${customerTrustScore}/100) has fallen below the 65-point safety threshold. Automated refunds are disabled for high-risk accounts. Contact fraud-compliance@swiss-app.com.`;
                logKafka('system', 'fraud.low_trust_block', `Abuse Shield Blocked Refund: Low Customer Trust score (${customerTrustScore}/100)`);
                triggerToast('FRAUD SHIELD: Blocked refund request due to low trust score.', 'admin');

                </div>
              </div>

              <div className="glass-card" style={{ padding: '0.65rem 0.75rem', display: 'flex', flexDirection: 'column', gap: '0.25rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.7rem', fontWeight: 700 }}>
                  <span style={{ color: 'var(--text-secondary)' }}>Security Guardrails Node</span>
                  <span style={{ color: jwtFlash ? 'var(--color-customer)' : 'var(--text-muted)' }}>
                    {jwtFlash ? '● JWT VALIDATED' : '● JWT STANDBY'}
                  </span>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.65rem', color: 'var(--text-muted)', marginTop: '0.15rem' }}>
                  <span>Secrets rotation cycle:</span>
                  <span style={{ fontFamily: 'var(--font-mono)' }}>{vaultTimer}s (HashiCorp Vault)</span>
                </div>
              </div>

              <div className="metric-grid">
                <div className="metric-card">
                  <span className="metric-label">BFF Latency</span>
                  <span className="metric-value" style={{ color: latencyHistory[latencyHistory.length - 1] > 200 ? 'var(--color-admin)' : 'var(--color-customer)' }}>
                    {latencyHistory[latencyHistory.length - 1]} ms
                  </span>
                  <div className="metric-bar">
                    <div 
                      className="metric-fill" 
                      style={{ 
                        width: `${Math.min(100, (latencyHistory[latencyHistory.length - 1] / 300) * 100)}%`, 
                        background: latencyHistory[latencyHistory.length - 1] > 200 ? 'var(--color-admin)' : 'var(--color-customer)' 
                      }} 
                    />
                  </div>
                </div>

                <div className="metric-card">
                  <span className="metric-label">Redis Cache Hit Rate</span>
                  <span className="metric-value" style={{ color: 'var(--color-engine)' }}>
                    {cacheHits + cacheMisses > 0 
                      ? Math.round((cacheHits / (cacheHits + cacheMisses)) * 100) 
                      : 100}%
                  </span>
                  <div className="metric-bar">
                    <div 
                      className="metric-fill" 
                      style={{ 
                        width: `${cacheHits + cacheMisses > 0 ? (cacheHits / (cacheHits + cacheMisses)) * 100 : 100}%`, 
                        background: 'var(--color-engine)' 
                      }} 
                    />
                  </div>
                </div>
              </div>

              <div className="glass-card" style={{ padding: '0.75rem 1rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.7rem', fontWeight: 600, color: 'var(--text-secondary)', marginBottom: '0.5rem' }}>
                  <span>BFF API Gateway Response Latency History</span>
                  <span style={{ fontFamily: 'var(--font-mono)' }}>Max: 300ms</span>
                </div>
                
                <svg viewBox="0 0 300 80" style={{ width: '100%', height: '50px', background: '#020408', borderRadius: '6px', border: '1px solid var(--border-color)' }}>
                  <polyline
                    fill="none"
                    stroke="var(--color-engine)"
                    strokeWidth="2"
                    points={latencyHistory.map((val, idx) => {
                      const x = (idx / (latencyHistory.length - 1)) * 280 + 10;
                      const y = 70 - (Math.min(val, 300) / 300) * 60;
                      return `${x},${y}`;
                    }).join(' ')}
                  />
                </svg>
              </div>

              <div className="kafka-console">
                <div className="kafka-console-header">
                  <span className="kafka-console-title">Kafka Event Broker Console</span>
                  <div style={{ display: 'flex', gap: '0.35rem' }}>
                    <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#ef4444' }}></span>
                    <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#f59e0b' }}></span>
                    <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#10b981' }}></span>
                  </div>
                </div>

                <div className="kafka-log-list">
                  {kafkaLogs.map(log => (
                    <div key={log.id} className="kafka-log-item">
                      <span className="kafka-log-time">[{log.time}]</span>
                      <span className={`kafka-log-event event-${log.source}`}>{log.event}</span>
                      <span className="kafka-log-meta">↳ {log.meta}</span>
                    </div>
                  ))}
                </div>
              </div>

            </section>

          </main>

          {certModalOpen && (
            <div className="cert-modal-overlay">
              <div className="cert-modal-content">
                <div style={{ width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h4 style={{ fontWeight: 800, color: 'var(--color-business)', display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                    <Lucide.Sparkles size={18} />
                    Swiss Loyalty Certificate Desk
                  </h4>
                  <button className="ai-bot-close-btn" onClick={() => setCertModalOpen(false)}>
                    <Lucide.X size={18} />
                  </button>
                </div>
                
                <canvas 
                  ref={canvasRef} 
                  width="560" 
                  height="360" 
                  className="cert-canvas"
                />
                
                <div className="cert-modal-actions">
                  <button className="btn-primary-glow" style={{ background: 'var(--color-business)', color: '#ffffff' }} onClick={handleDownloadCert}>
                    Download Certificate (.PNG)
                  </button>
                  <button className="btn-secondary-glow" onClick={() => setCertModalOpen(false)}>
                    Dismiss Desk
                  </button>
                </div>
              </div>
            </div>
          )}

          <div>
            <div id="btn-support-bot-open" className="ai-bot-toggle-btn" onClick={() => setBotOpen(!botOpen)}>
              {botOpen ? <Lucide.MessageSquareDashed size={24} /> : <Lucide.Bot size={24} />}
            </div>
            
            {botOpen && (
              <div className="glass-card ai-bot-window">
                <div className="ai-bot-header">
                  <div className="ai-bot-header-title">
                    <Lucide.Bot size={18} />
                    <span>Swiss AI Help Center</span>
                  </div>
                  <button id="btn-support-bot-close" className="ai-bot-close-btn" onClick={() => setBotOpen(false)}>
                    <Lucide.X size={16} />
                  </button>
                </div>
                
                <div className="ai-bot-messages">
                  {botMessages.map((msg, idx) => (
                    <div key={idx} className={`ai-message ${msg.sender === 'user' ? 'ai-message-user' : 'ai-message-bot'}`}>
                      {msg.text}
                      {msg.attachmentUrl && (
                        <img 
                          src={msg.attachmentUrl} 
                          className="ai-message-attachment" 
                          alt="Simulated vision report upload" 
                        />
                      )}
                    </div>
                  ))}
                  <div ref={botMessagesEndRef} />
                </div>
                
                <div className="ai-bot-input-area">
                  <input 
                    id="input-support-bot"
                    type="text" 
                    className="ai-bot-input" 
                    placeholder="Ask about orders, refunds..."
                    value={botInputText}
                    onChange={(e) => setBotInputText(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendBotMessage()}
                  />
                  
                  <button 
                    id="btn-support-bot-attach"
                    className="ai-bot-action-btn" 
                    title="Attach expired item photo (Simulated)"
                    onClick={() => {
                      triggerToast('Simulated camera capture: expired_milk.png uploaded.', 'system');
                      handleSendBotMessage('https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&q=80&w=200');
                    }}
                  >
                    <Lucide.Image size={16} />
                  </button>
                  
                  <button 
                    id="btn-support-bot-voice"
                    className="ai-bot-action-btn" 
                    title="Send voice message (Simulated)"
                    onClick={() => {
                      setBotInputText('Where is my order?');
                      triggerToast('Voice recognized: "Where is my order?"', 'system');
                    }}
                  >
                    <Lucide.Mic size={16} />
                  </button>

                  <button id="btn-support-bot-send" className="ai-bot-action-btn" onClick={() => handleSendBotMessage()}>
                    <Lucide.Send size={16} />
                  </button>
                </div>
              </div>
            )}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
