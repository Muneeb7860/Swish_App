<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss Quick Commerce Simulator - Robust, Swift & Lightweight</title>
  <meta name="description" content="A high-fidelity single-page simulator demonstrating a robust 10-minute Quick Commerce microservice stack: Customer Super App, Rider Light, Business analytics, Dark Store pick-lists, and Chaos engineering.">
  
  <!-- Styling Sheet -->
  
  <!-- Font Preloads (LCP Optimization) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" media="print" onload="this.media='all'" fetchpriority="high">
</head>
<body>
  <script>
    const oldError = console.error;
    console.error = function() {
      var msgs = Array.from(arguments).join(' ');
      if (msgs.includes('React DevTools') || msgs.includes('favicon')) { oldError.apply(console, arguments); return; }
      var div = document.createElement('div');
      div.style = "color:white; background:#ef4444; padding: 20px; font-size: 16px; position:absolute; z-index:99999; top:0; left:0; width:100%; font-family:sans-serif;";
      div.innerHTML = '<h2>🚨 Console.Error Caught!</h2><pre style="background:#450a0a; padding:10px; overflow:auto;">' + msgs + '</pre>';
      document.body.appendChild(div);
      oldError.apply(console, arguments);
    };
    window.onerror = (msg, url, lineNo, columnNo, error) => {
      if (msg === 'Script error.') return false; // Ignore masked CORS errors now
      var div = document.createElement('div');
      div.style = "color:white; background:#ef4444; padding: 20px; font-size: 16px; position:absolute; z-index:99999; top:0; left:0; width:100%; font-family:sans-serif;";
      div.innerHTML = '<h2>🚨 UI Execution Error</h2><p><strong>Message:</strong> ' + msg + '</p>' +
        '<p><strong>Location:</strong> Line ' + lineNo + ' Column ' + columnNo + '</p>' +
        '<pre style="background:#450a0a; padding:10px; overflow:auto;">' + (error && error.stack ? error.stack : 'No stack trace') + '</pre>';
      document.body.appendChild(div);
      return false;
    };
    window.addEventListener('unhandledrejection', (event) => {
      var div = document.createElement('div');
      div.style = "color:white; background:#ef4444; padding: 20px; font-size: 16px; position:absolute; z-index:99999; top:0; left:0; width:100%; font-family:sans-serif;";
      div.innerHTML = '<h2>🚨 Unhandled Promise Rejection</h2><p><strong>Reason:</strong> ' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '</p>' +
        '<pre style="background:#450a0a; padding:10px; overflow:auto;">' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre>';
      document.body.appendChild(div);
    });
  </script>

  <!-- Root mount point for the React Cockpit -->
  <div id="root">
    <div style="display: flex; height: 100vh; justify-content: center; align-items: center; background: #070a13; color: #94a3b8; font-family: sans-serif;">
      <div style="text-align: center;">
        <h2 style="color: #f8fafc; margin-bottom: 0.5rem;">swiss_App Engine Starting...</h2>
        <p style="font-size: 0.85rem;">Compiling ES Modules and mounting simulated backend services...</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
