server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Invite-only beta gate (mounted .htpasswd)
    auth_basic           "Swish Closed Beta";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    location /api/ {
        # The beta basic-auth gate (above) and the app's JWT both use the
        # Authorization header. When the SPA sends "Authorization: Bearer <jwt>"
        # it overrides the browser's "Authorization: Basic", so with basic-auth
        # active here every authenticated API call fails nginx auth with 401.
        # Turn basic-auth OFF for /api — the backend already enforces JWT on
        # protected endpoints; basic-auth stays on the UI (/, /remotes) to keep
        # the beta invite-only. Public endpoints (register/login) are meant to
        # be reachable anyway.
        auth_basic off;
        proxy_pass http://host.docker.internal:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
    location /remotes/ { try_files $uri =404; }
    location / { index index.html; try_files $uri $uri/ /index.html; }
}
