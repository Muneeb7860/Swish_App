version: '3.8'

services:
  postgres-gis:
    build:
      context: .
      dockerfile: ./infrastructure/postgres-gis/Dockerfile
    container_name: postgres-gis
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adminpassword}
      POSTGRES_DB: ${DB_NAME:-b2b_qcomm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
    networks:
      - hybrid-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-b2b_qcomm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    environment:
      REDIS_ARGS: "--notify-keyspace-events Ex --appendonly yes --appendfsync everysec --requirepass ${REDIS_PASSWORD:-redissecurepassword}"
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    volumes:
      - redisdata:/data
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 256M

  mongo:
    image: mongo:6
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-adminpassword}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    environment:
      # KRaft mode requires a CLUSTER_ID to format storage; without it the
      # confluent image fails standalone `docker compose up` ("dub ensure CLUSTER_ID").
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 1G

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-gis:5432/${DB_NAME:-b2b_qcomm}
      KC_DB_USERNAME: ${DB_USER:-admin}
      KC_DB_PASSWORD: ${DB_PASSWORD:-adminpassword}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    ports:
      - "8180:8080"
    depends_on:
      postgres-gis:
        condition: service_healthy
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 512M

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - "9090:9090"
    # host.docker.internal lets the container scrape the host-run backend (:8083);
    # the host-gateway mapping makes this portable to Linux (it is implicit on
    # Docker Desktop for Mac/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alert.rules:/etc/prometheus/alert.rules:ro
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    # Host port 3300: the frontend-host dev server owns localhost:3000
    # (vite + demo/start.sh + gateway CORS), so Grafana moves aside.
    ports:
      - "3300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # Auto-provision the Prometheus/Zipkin datasources and the Mission Control
    # dashboard on startup so Grafana is useful with zero manual clicks.
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 256M

  # Distributed-tracing backend for the Java services. The backend already has
  # the opentelemetry-exporter-zipkin dependency and exports spans to
  # ${ZIPKIN_ENDPOINT:-http://localhost:9411/api/v2/spans}; this container is the
  # sink, and the Grafana 'Zipkin' datasource (uid swish-zipkin) reads from it.
  # Phoenix (OTLP, :4318) remains the sink for Python/LLM governance spans.
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 384M

  # OpenTelemetry Collector — single tracing hub (Epic 2.5). Owns the host OTLP
  # ports (4317/4318); the host-run Java backend and Python governance service
  # both export here, and it fans out to Zipkin (unified trace) + Phoenix (LLM).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - zipkin
      - phoenix
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 192M

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    # OTLP ports are no longer host-published — the collector now owns 4317/4318
    # on the host and forwards to phoenix:4317 over the internal compose network.
    # 6006 stays exposed for the Phoenix LLM-trace UI.
    ports:
      - "6006:6006"
    environment:
      PHOENIX_PORT: 6006
      PHOENIX_GRPC_PORT: 4317
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 512M

  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: temporal
    ports:
      - "7233:7233"
      - "8233:8080"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-adminpassword}
      - POSTGRES_PWD=${DB_PASSWORD:-adminpassword}
      - POSTGRES_SEEDS=postgres-gis
    depends_on:
      postgres-gis:
        condition: service_healthy
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 512M

  letta:
    image: letta/letta:latest
    container_name: letta
    ports:
      - "8283:8283"
    environment:
      - LETTA_PG_URI=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-adminpassword}@postgres-gis:5432/letta
      # Local Ollama backend (free/local-only AI policy). OPENAI_API_KEY stays a
      # dummy so no paid OpenAI calls are ever made; agents use ollama/* models.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENAI_API_KEY=dummy-key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-gis:
        condition: service_healthy
    networks:
      - hybrid-net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  mongodata:
  redisdata:
  grafanadata:

networks:
  hybrid-net:
    driver: bridge
