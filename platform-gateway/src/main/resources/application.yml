server:
  port: 8080

spring:
  application:
    name: platform-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key-value: ${JWT_SECRET:my-secret-key-that-is-long-enough-to-be-secure-for-jwt-signature-verification-32bytes-long}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:3002"
              - "http://localhost:3003"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: core-business-engine
          uri: ${CORE_BUSINESS_URL:http://localhost:8081}
          predicates:
            - Path=/api/checkout/**, /api/inventory/**
          filters:
            - name: Idempotency
        - id: notification-websocket
          uri: ${NOTIFICATION_WS_URL:ws://localhost:8082}
          predicates:
            - Path=/ws/notifications/**
        - id: shared-rewards-service
          uri: ${BACKEND_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/rewards/**
          filters:
            - name: CircuitBreaker
              args:
                name: rewardsCircuitBreaker
                fallbackUri: forward:/api/v1/public/fallback/rewards
        - id: shared-ledger-service
          uri: ${BACKEND_URL:http://localhost:8083}
          predicates:
            - Path=/api/ledger/**
          filters:
            - name: CircuitBreaker
              args:
                name: ledgerCircuitBreaker
                fallbackUri: forward:/api/v1/public/fallback/ledger
        - id: governance-service
          uri: ${BACKEND_URL:http://localhost:8083}
          predicates:
            - Path=/api/governance/**
          filters:
            - name: CircuitBreaker
              args:
                name: governanceCircuitBreaker
        - id: backend-core
          uri: ${BACKEND_URL:http://localhost:8083}
          predicates:
            - Path=/api/**
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: DEBUG
