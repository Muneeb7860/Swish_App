server:
  port: 8080

spring:
  application:
    name: platform-gateway
  cloud:
    gateway:
      routes:
        - id: core-business-engine
          uri: ${CORE_BUSINESS_URL:http://localhost:8081}
          predicates:
            - Path=/api/checkout/**, /api/inventory/**
          filters:
            - name: IdempotencyFilter
        - id: notification-websocket
          uri: ${NOTIFICATION_WS_URL:ws://localhost:8082}
          predicates:
            - Path=/ws/notifications/**
        - id: shared-async-services
          uri: ${NOTIFICATION_ENGINE_URL:http://localhost:8082}
          predicates:
            - Path=/api/rewards/**, /api/ledger/**
        - id: backend-core
          uri: ${BACKEND_URL:http://localhost:8083}
          predicates:
            - Path=/api/**
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
