spring:
  application:
    name: platform-gateway
  data:
    redis:
      host: localhost
      port: 6379
      
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/master

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5000"
              - "http://localhost:5001"
              - "http://localhost:5002"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: core-checkout-route
          uri: http://169.254.1.1:8080
          predicates:
            - Path=/api/v1/checkout/**
          filters:
            - name: RedisIdempotencyFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: checkoutCircuitBreaker
                fallbackUri: forward:/api/v1/fallback/checkout-stalled
        - id: notification-websocket
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/api/v1/fallback/notification-unavailable

  ai:
    ollama:
      base-url: http://localhost:11434
    groq:
      api-key: ${GROQ_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
