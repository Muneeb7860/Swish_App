# ==========================================
# SWISS QUICK COMMERCE BACKEND CONFIGURATIONS
# ==========================================

# Server Settings
server.port=8080
server.servlet.context-path=

# Database Connection Settings (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:swiss_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_LOCK_TIMEOUT=1500;INIT=CREATE SCHEMA IF NOT EXISTS oltp\\;CREATE SCHEMA IF NOT EXISTS dispatch\\;CREATE SCHEMA IF NOT EXISTS wholesaler
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP Connection Pool Configurations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.flyway.enabled=false

# Logging Level
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Custom Security Settings (JWT and MFA)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
mfa.otp.expiration-sec=180
swish.security.db.encryption.key=${DB_ENCRYPTION_KEY:my-default-32-byte-db-encryption-key-for-local-dev-only!}

# GCP Secret Manager is a prod-only concern — disable its autoconfiguration so
# the test context never attempts to build a real SecretManagerServiceClient
# (which fails without GCP Application Default Credentials, e.g. in CI).
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.secretmanager.enabled=false

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=swiss-qcommerce-group
# Prevent @KafkaListener containers from auto-starting in tests (no broker available)
spring.kafka.listener.auto-startup=false
# Limit reconnect attempts frequency to prevent CPU/log storm in tests
spring.kafka.properties.reconnect.backoff.ms=300000
spring.kafka.properties.reconnect.backoff.max.ms=300000
spring.kafka.properties.retry.backoff.ms=300000


# Redis Geospatial Cache Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:redissecurepassword}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=3000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.kafka.consumer.auto-offset-reset=earliest

# MongoDB OLAP Configuration
spring.data.mongodb.uri=mongodb://${MONGO_APP_USER:swiss_app}:${MONGO_APP_PASSWORD:swiss_app_password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/swiss_olap?authSource=swiss_olap&maxPoolSize=${MONGO_MAX_POOL_SIZE:20}&minPoolSize=${MONGO_MIN_POOL_SIZE:2}&connectTimeoutMS=${MONGO_CONNECT_TIMEOUT:5000}&socketTimeoutMS=${MONGO_SOCKET_TIMEOUT:10000}
spring.data.mongodb.auto-index-creation=false
swish.mongo.archive.enabled=false
management.health.mongo.enabled=false

# Observability: Metrics and Tracing
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.export.prometheus.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Spring AI OpenAI configurations (Gemini 2.0 Flash)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:mock-key}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.chat.options.model=gemini-2.0-flash

# Spring AI Ollama configurations (Local Qwen 2.5)
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://host.docker.internal:11434}
spring.ai.ollama.chat.options.model=qwen2.5:7b

JWT_SECRET=test-secret-key-that-is-long-enough-to-be-secure-for-jwt-signature-verification-32bytes-long
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.main.allow-bean-definition-overriding=true
spring.scheduling.enabled=false

# ── Resilience4j Circuit Breaker Configurations ───────────────────────────────
resilience4j.circuitbreaker.instances.governance.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.governance.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.governance.slidingWindowSize=5
resilience4j.circuitbreaker.instances.governance.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.governance.failureRateThreshold=60
resilience4j.circuitbreaker.instances.governance.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.governance.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.governance.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.governance.allowHealthIndicatorToFail=false

resilience4j.circuitbreaker.instances.carrierRate.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.carrierRate.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.carrierRate.slidingWindowSize=5
resilience4j.circuitbreaker.instances.carrierRate.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.carrierRate.failureRateThreshold=50
resilience4j.circuitbreaker.instances.carrierRate.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.carrierRate.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.carrierRate.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.carrierRate.allowHealthIndicatorToFail=false

resilience4j.circuitbreaker.instances.fmcg-api.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.fmcg-api.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.fmcg-api.slidingWindowSize=5
resilience4j.circuitbreaker.instances.fmcg-api.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.fmcg-api.failureRateThreshold=50
resilience4j.circuitbreaker.instances.fmcg-api.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.fmcg-api.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.fmcg-api.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.fmcg-api.allowHealthIndicatorToFail=false

resilience4j.circuitbreaker.instances.competitor-api.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.competitor-api.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.competitor-api.slidingWindowSize=5
resilience4j.circuitbreaker.instances.competitor-api.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.competitor-api.failureRateThreshold=50
resilience4j.circuitbreaker.instances.competitor-api.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.competitor-api.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.competitor-api.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.competitor-api.allowHealthIndicatorToFail=false


