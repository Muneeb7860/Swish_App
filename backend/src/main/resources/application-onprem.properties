# ==========================================
# SWISH OS ON-PREMISES RELEASE CONFIGURATIONS
# ==========================================

# Database Connection Settings (Local PostgreSQL Clustered Instance)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swiss_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresSecurePassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

# Spring Cloud Vault Configurations (On-Premises Secrets Engine)
spring.cloud.vault.enabled=${VAULT_ENABLED:true}
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:dev-token-change-me}
spring.cloud.vault.scheme=http
spring.config.import=optional:vault://

# MinIO Local Object Storage Settings (WORM-compliant auditing ledger)
swish.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
swish.minio.access-key=${MINIO_ACCESS_KEY:minioAdmin}
swish.minio.secret-key=${MINIO_SECRET_KEY:minioAdminSecure}
swish.minio.bucket-name=${MINIO_BUCKET_NAME:ledger-archives}

# Local LLM Inference Orchestration
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=qwen2.5:7b
