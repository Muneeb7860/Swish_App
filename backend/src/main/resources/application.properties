# ==========================================
# SWISS QUICK COMMERCE BACKEND CONFIGURATIONS
# ==========================================

# Server Settings
server.port=8080
server.servlet.context-path=

# Database Connection Settings (H2 In-Memory — DEV ONLY, use PostgreSQL in prod via application-prod.properties)
spring.datasource.url=jdbc:h2:mem:swiss_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS oltp\\;CREATE SCHEMA IF NOT EXISTS olap
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP Connection Pool Configurations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=oltp,olap
spring.flyway.baseline-on-migrate=true

# Logging Level
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Custom Security Settings (JWT and MFA)
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLXN3aXNzLXEtY29tbWVyY2U=}
jwt.expiration-ms=86400000
mfa.otp.expiration-sec=180

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=swiss-qcommerce-group

# Redis Geospatial Cache Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=3000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.kafka.consumer.auto-offset-reset=earliest

# MongoDB OLAP Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/swiss_olap

# Observability: Metrics and Tracing
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.export.prometheus.enabled=true
management.tracing.sampling.probability=0.1
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Spring AI OpenAI configurations (Gemini 2.0 Flash)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:mock-key}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.chat.options.model=gemini-2.0-flash

# Spring AI Ollama configurations (Local Qwen 2.5)
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://host.docker.internal:11434}
spring.ai.ollama.chat.options.model=qwen2.5:7b

