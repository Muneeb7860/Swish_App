# ==========================================
# SWISS QUICK COMMERCE BACKEND CONFIGURATIONS
# ==========================================

spring.profiles.active=dev

# Server Settings
# Cloud Run injects PORT=8080; local/docker-compose default is 8083.
server.port=${PORT:8083}
server.servlet.context-path=

# Database Connection Settings (H2 In-Memory — DEV ONLY, use PostgreSQL in prod via application-prod.properties)
spring.datasource.url=jdbc:h2:mem:swiss_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS oltp\\;CREATE SCHEMA IF NOT EXISTS olap\\;CREATE SCHEMA IF NOT EXISTS dispatch\\;CREATE SCHEMA IF NOT EXISTS wholesaler
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP Connection Pool Configurations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=oltp,olap,dispatch
spring.flyway.baseline-on-migrate=true

# Logging Level
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Custom Security Settings (JWT and MFA)
# JWT_SECRET must be set as an environment variable — no default is permitted.
# The application will fail to start if JWT_SECRET is absent.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
mfa.otp.expiration-sec=180
swish.security.db.encryption.key=${DB_ENCRYPTION_KEY:my-default-32-byte-db-encryption-key-for-local-dev-only!}

# ─── GCP Secret Manager — DISABLED by default ────────────────────────────────
# The spring-cloud-gcp-starter-secretmanager autoconfiguration eagerly builds a
# real SecretManagerServiceClient whenever it is on the classpath, which fails
# with "default credentials not found" in any environment without GCP ADC
# (CI, local dev without gcloud auth). Secret Manager is a PROD-ONLY concern, so
# it is disabled here and re-enabled in application-prod.properties.
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.secretmanager.enabled=false

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=swiss-qcommerce-group

# Redis Geospatial Cache Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:redissecurepassword}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=3000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.kafka.consumer.auto-offset-reset=earliest

# MongoDB OLAP Configuration
spring.data.mongodb.uri=mongodb://${MONGO_APP_USER:swiss_app}:${MONGO_APP_PASSWORD:swiss_app_password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/swiss_olap?authSource=swiss_olap&maxPoolSize=${MONGO_MAX_POOL_SIZE:20}&minPoolSize=${MONGO_MIN_POOL_SIZE:2}&connectTimeoutMS=${MONGO_CONNECT_TIMEOUT:5000}&socketTimeoutMS=${MONGO_SOCKET_TIMEOUT:10000}
spring.data.mongodb.auto-index-creation=false
# Negotiation-event archive (FR-02): disabled by default so dev/CI run without a
# MongoDB instance and the NoOp archive adapter is active. Enable in prod.
swish.mongo.archive.enabled=false
# Keep /actuator/health UP when MongoDB is absent (the client is lazy; the write
# adapter is conditional). Re-enable in prod where Mongo is provisioned.
management.health.mongo.enabled=false
management.health.kafka.enabled=false

# SpringDoc OpenAPI 3.0
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=true
springdoc.packagesToScan=ch.swissqcommerce.backend

# Observability: Metrics and Tracing
management.endpoints.web.exposure.include=health,info,prometheus,mappings
management.metrics.export.prometheus.enabled=true
# Dev traces every request so the unified end-to-end trace is always visible;
# lower this (e.g. 0.1) in prod via TRACING_SAMPLE_PROBABILITY.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
# Epic 2.5 — unified tracing: export OTLP to the OpenTelemetry Collector (host
# :4318), which fans out to Zipkin (unified distributed trace, viewed in Grafana)
# and Phoenix (LLM spans). This replaces the direct Zipkin export so the Java
# backend and the Python governance service converge in one hub under one traceId.
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Spring AI OpenAI configurations (Gemini 2.0 Flash)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:mock-key}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.chat.options.model=gemini-2.0-flash

# Spring AI Ollama configurations (Local Qwen 2.5)
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://host.docker.internal:11434}
spring.ai.ollama.chat.options.model=qwen2.5:7b

# Python Governance Service (Phase R5)
swish.governance.api.url=${SWISH_GOVERNANCE_API_URL:}

# Letta Agent Server (Phase 4)
swish.letta.api.url=${SWISH_LETTA_API_URL:http://localhost:8283}
swish.letta.api.token=${SWISH_LETTA_API_TOKEN:dummy-key}
swish.letta.model=${SWISH_LETTA_MODEL:openai/gpt-4o}

# Event-Driven Automation (Phase 7)
# Shared secret for HMAC-SHA256 webhook signature validation (n8n callbacks).
swish.webhook.secret=${SWISH_WEBHOOK_SECRET:dev-webhook-secret-change-me}

# Kimi Moonshot AI configurations
swish.kimi.api.key=
swish.kimi.api.url=https://api.moonshot.ai/v1
swish.kimi.model=moonshot-v1-8k

# Carrier API Endpoint
carrier.api.url=http://localhost:${PORT:8083}/api/carrier/rate

# ── Resilience4j Circuit Breaker — AI Governance ───────────────────────────────
# Breaker name "governance" matches @CircuitBreaker(name="governance") in ResilientLlmGateway.
# Opens after 3 consecutive failures, waits 30s before allowing a probe, closes after 2 successes.
resilience4j.circuitbreaker.instances.governance.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.governance.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.governance.slidingWindowSize=5
resilience4j.circuitbreaker.instances.governance.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.governance.failureRateThreshold=60
resilience4j.circuitbreaker.instances.governance.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.governance.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.governance.automaticTransitionFromOpenToHalfOpenEnabled=true
# Expose metrics to Micrometer (→ Prometheus → Grafana panel #62)
resilience4j.circuitbreaker.instances.governance.allowHealthIndicatorToFail=false
