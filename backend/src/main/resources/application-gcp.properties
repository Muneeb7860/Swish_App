# ==========================================
# SWISH OS GCP DEVELOPMENT RELEASE CONFIGURATIONS
# ==========================================

# Database Connection Settings (PostgreSQL / Cloud SQL Proxy)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swiss_db}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresSecurePassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

# GCP Secret Manager Integration (Spring Cloud secret backend routing properties)
spring.cloud.gcp.core.enabled=${GCP_CORE_ENABLED:true}
spring.cloud.gcp.secretmanager.enabled=${GCP_SECRETMANAGER_ENABLED:true}
spring.cloud.gcp.project-id=${GOOGLE_CLOUD_PROJECT:}
spring.config.import=optional:sm://
jwt.secret=${sm://JWT_SECRET:my-secret-key-that-is-long-enough-for-development}

# Google Cloud Storage (GCS) WORM Auditing Settings (Cloud Storage client bucket binding)
swish.gcs.bucket-name=${GCS_BUCKET_NAME:swish-ledger-archives}

# Spring AI / Gemini Cloud Endpoints Configuration (Resilient fallback gateway circuit breakers)
spring.ai.vertex.ai.gemini.project-id=${GOOGLE_CLOUD_PROJECT:}
spring.ai.vertex.ai.gemini.location=${GOOGLE_CLOUD_LOCATION:us-central1}
spring.ai.vertex.ai.gemini.chat.options.model=gemini-1.5-flash
