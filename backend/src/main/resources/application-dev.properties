# Database Connection Settings (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:swiss_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS oltp\\;CREATE SCHEMA IF NOT EXISTS olap\\;CREATE SCHEMA IF NOT EXISTS dispatch\\;CREATE SCHEMA IF NOT EXISTS wholesaler
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Development-only SQL logging and parameter binding checks
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Tracing configuration
management.tracing.sampling.probability=1.0

# Local dev fallback caching and health checks
spring.cache.type=simple
management.health.redis.enabled=false

# AI governance bridge — activate the governed LLM path locally (PII gate →
# semantic router → guardrails → rate limit via the Python service).
# Start it with: cd homelab-ai-governance && .venv/bin/python -m governance.cli
# If the service is down, ResilientLlmGateway falls back safely (Gemini → Mock),
# so dev is never blocked. Staging/prod stay env-driven (set SWISH_GOVERNANCE_API_URL).
swish.governance.api.url=${SWISH_GOVERNANCE_API_URL:http://localhost:8000}

# ==========================================
# HYBRID FOOTPRINT SWITCHING PROPERTIES
# ==========================================
# By default, local dev uses the H2 in-memory database and local caches.
# To load the on-premises configuration (Vault, MinIO, Postgres, Ollama):
#   spring.profiles.active=dev,onprem
# To load the GCP configuration (Secret Manager, GCS, Postgres, Gemini):
#   spring.profiles.active=dev,gcp

