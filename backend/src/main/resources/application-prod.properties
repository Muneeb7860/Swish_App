# Database Connection Settings (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:swiss_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

# ─── GCP Secret Manager ──────────────────────────────────────────────────────
# Re-enable the GCP integration that is disabled by default in
# application.properties. Both flags must be true here for the sm:// config
# import below (and the SecretManagerServiceClient it needs) to be created.
spring.cloud.gcp.core.enabled=true
spring.cloud.gcp.secretmanager.enabled=true

# On Cloud Run the GCP project ID is resolved automatically from the metadata
# server. GOOGLE_CLOUD_PROJECT env var is set automatically by Cloud Run.
spring.cloud.gcp.project-id=${GOOGLE_CLOUD_PROJECT:}

# optional:sm:// — if GCP credentials are not present (local testing without ADC)
# Spring Boot skips Secret Manager and the env-var fallback in application.properties
# takes over. On Cloud Run the Cloud Run service account must have
# roles/secretmanager.secretAccessor on the project.
spring.config.import=optional:sm://

# Override jwt.secret with the GCP Secret Manager version in production.
# The value stored in Secret Manager must be the raw HMAC-SHA256 key string.
# Create / update via:
#   gcloud secrets create JWT_SECRET --replication-policy=automatic
#   echo -n "<your-256-bit-key>" | gcloud secrets versions add JWT_SECRET --data-file=-
jwt.secret=${sm://JWT_SECRET}
