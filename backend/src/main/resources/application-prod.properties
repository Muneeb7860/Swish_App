# ==========================================
# PRODUCTION PROFILE CONFIGURATIONS (ON-PREM)
# ==========================================

# Database Connection Settings (PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgres:5432/swissq
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL Auto & Validation Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cache Configuration (Redis)
spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Kafka Broker (Redpanda)
spring.kafka.bootstrap-servers=redpanda:29092

# MongoDB OLAP Configuration
spring.data.mongodb.uri=mongodb://mongodb:27017/swiss_olap
