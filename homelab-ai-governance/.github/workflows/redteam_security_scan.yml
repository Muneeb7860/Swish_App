name: Agentic Red-Team Security Gate

on:
  push:
    branches: [ main, master, mac-machine ]
  pull_request:
    branches: [ main, master, mac-machine ]
  schedule:
    - cron: '0 0 * * *' # Daily midnight security scan

jobs:
  redteam-security-scan:
    name: OWASP Agentic Security Evaluation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Governance Engine & Red-Team Harness
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install git+https://github.com/muneeb7860/agentic-redteam.git || pip install agentic-redteam || true

      - name: Start Governance Server (Mock Mode)
        env:
          GOVERNANCE_ALLOW_MOCK_FALLBACK: "1"
          SWISHOS_HITL_SECRET: "ci-test-hitl-secret-key-32-bytes!"
          SWISHOS_AUDIT_PROOF_SECRET: "ci-test-audit-proof-secret-32-bytes"
        run: |
          PYTHONPATH=src python -m uvicorn governance.server:app --host 127.0.0.1 --port 8000 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          
          # Health probe check
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q "UP"; then
              echo "Governance server is UP and healthy."
              break
            fi
            sleep 0.5
          done

      - name: Execute Red-Team Security Probes & Generate SARIF
        env:
          GOVERNANCE_ALLOW_MOCK_FALLBACK: "1"
        run: |
          # Generate JSON results
          python -m agentic_redteam.cli --ci --target-url http://127.0.0.1:8000/api/v1/govern --output-file redteam_results.json || SCAN_EXIT_CODE=$?
          
          # Generate SARIF results for GitHub Security tab
          python -m agentic_redteam.cli --format sarif --target-url http://127.0.0.1:8000/api/v1/govern --output-file redteam_results.sarif || true
          
          echo "SCAN_EXIT_CODE=${SCAN_EXIT_CODE:-0}" >> $GITHUB_ENV

      - name: Upload SARIF Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('redteam_results.sarif') != ''
        with:
          sarif_file: redteam_results.sarif
          category: agentic-redteam

      - name: Generate PR Markdown Summary Comment
        if: github.event_name == 'pull_request' && always()
        run: |
          python3 -c '
          import json, os

          json_path = "redteam_results.json"
          if not os.path.exists(json_path):
              print("No JSON results found")
              exit(0)

          with open(json_path) as f:
              data = json.load(f)

          score = data.get("composite_owasp_score", 100)
          pass_rate = data.get("overall_pass_rate_pct", 100.0)
          passed = data.get("total_passed", 0)
          failed = data.get("total_failed", 0)
          status_icon = "🟢 **PASSED**" if failed == 0 else "🔴 **FAILED**"

          comment = f"""### 🛡️ SwishOS Agentic Red-Team Security Report

          **Security Status**: {status_icon}
          - **Composite OWASP Security Score**: `{score}/100`
          - **Pass Rate**: `{pass_rate:.1f}%` ({passed} Passed, {failed} Failed)

          #### Category Breakdowns
          | OWASP Category | Score | Passed | Total | Status |
          | :--- | :--- | :--- | :--- | :--- |
          """
          for cat_id, cat_data in data.get("categories", {}).items():
              c_passed = cat_data.get("passed", 0)
              c_total = cat_data.get("total", 0)
              c_score = cat_data.get("score", 100)
              icon = "✅" if c_passed == c_total else "❌"
              comment += f"| `{cat_id}` | `{c_score}/100` | `{c_passed}/{c_total}` | `{c_total}` | {icon} |\n"

          comment += "\n*Report generated automatically by agentic-redteam CI action.*"
          with open("pr_comment.md", "w") as out:
              out.write(comment)
          '

      - name: Comment PR Report
        if: github.event_name == 'pull_request' && always() && hashFiles('pr_comment.md') != ''
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: pr_comment.md
          comment_tag: agentic-redteam-report

      - name: Enforce Security Quality Gate
        run: |
          if [ "${SCAN_EXIT_CODE}" -ne 0 ]; then
            echo "❌ Agentic Red-Team Security Gate FAILED! Critical/High vulnerabilities detected."
            exit 1
          fi
          echo "✅ Security Gate PASSED."
