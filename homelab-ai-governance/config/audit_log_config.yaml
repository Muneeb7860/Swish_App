# audit_log_config.yaml — Telemetry log rotation and retention
rotation:
  max_file_size_mb: 100
  max_files: 12
  rotation_format: "audit-{date}.jsonl"
  compress_rotated: true
  retention_days: 365

paths:
  log_dir: data/logs
  log_file: audit.jsonl

counters:
  flush_interval_seconds: 3600  # hourly flush of non-match counters
