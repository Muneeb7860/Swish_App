# routing_config.yaml — Semantic Router thresholds, agent registry, budget, evaluation
classifier:
  model: qwen2.5:3b
  backend: ollama
  ollama_url: http://localhost:11434
  timeout_ms: 3000
  cpu_mode: true
  system_prompt_path: system_prompts/classifier_v2.txt

routing:
  confidence_threshold: 0.60
  max_context_tokens: 8000
  max_output_tokens: 4000

budget:
  daily_limit_usd: 5.00
  hourly_request_limit: 100
  cost_per_1k_input_tokens: 0.005
  cost_per_1k_output_tokens: 0.015

agents:
  gemma_reasoner:
    backend: ollama
    model: gemma3:4b
    ollama_url: http://localhost:11434
    timeout_ms: 45000
    role: reasoner
    fallback: true

  mistral_summarizer:
    backend: ollama
    model: mistral:latest
    ollama_url: http://localhost:11434
    timeout_ms: 30000
    role: summarizer

  deepseek_coder:
    backend: ollama
    model: deepseek-coder:latest
    ollama_url: http://localhost:11434
    timeout_ms: 45000
    role: coder

  cloud_frontier:
    backend: openai_compatible
    base_url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    timeout_ms: 30000
    role: frontier

  letta_support:
    backend: letta
    model: ollama/qwen2.5:7b
    letta_url: http://localhost:8283
    api_token: dummy-key
    timeout_ms: 30000
    role: stateful_support

  vllm_reasoner:
    backend: vllm
    model: qwen2.5-coder-7b-instruct
    vllm_url: http://localhost:8000
    timeout_ms: 45000
    role: reasoner


evaluation_rules:
  passing_threshold: 0.75
  max_self_correction_retries: 3
  weights:
    completeness: 0.3
    format_integrity: 0.4
    context_conservation: 0.3

intents:
  - general_knowledge
  - code_generation
  - code_debugging
  - code_review
  - summarization
  - creative_writing
  - data_analysis
  - system_admin
  - sensitive_query

rag:
  enabled: true
  # Connection string is read from $SWISH_RAG_DATABASE_URL when set; the value
  # below is a local-dev fallback only — do not put production creds here.
  database_url: postgresql://letta:lettapassword@localhost:5434/letta
  embedding_model: nomic-embed-text:latest
  embedding_url: http://localhost:11434/api/embeddings
  similarity_threshold: 0.60

# Audit analytics run on DuckDB over the append-only JSONL log (see
# audit_log_config paths) on demand — no separate audit server, credentials,
# or config block needed.


